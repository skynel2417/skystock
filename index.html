<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold mb-2 text-center">Bảng giá Chứng khoán Việt Nam</h1>
    <p class="text-center text-slate-400 mb-4 text-sm">
      Dữ liệu thật từ backend • Cập nhật mỗi 30 giây • Click mã để xem chart nến
    </p>
    <p id="status" class="text-center text-xs text-slate-500 mb-6">Đang tải dữ liệu...</p>

    <div class="overflow-x-auto rounded-xl border border-slate-700 bg-slate-900">
      <table class="w-full text-sm">
        <thead class="bg-slate-800 text-slate-300">
          <tr>
            <th class="py-3 px-4 text-left">Mã</th>
            <th class="py-3 px-4 text-right">Giá</th>
            <th class="py-3 px-4 text-right">±</th>
            <th class="py-3 px-4 text-right">%</th>
            <th class="py-3 px-4 text-right">Khối lượng</th>
            <th class="py-3 px-4 text-right">Trần / Sàn</th>
          </tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>

    <div class="mt-8">
      <h2 id="chartTitle" class="text-xl font-semibold mb-3">Biểu đồ nến: Chọn một mã ở trên</h2>
      <div id="chart" class="w-full h-80 md:h-96 rounded-xl border border-slate-700 bg-slate-900"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://skystock-api-1.onrender.com";
    const SYMBOLS = "ACB,BCM,BID,BVH,CTG,FPT,GAS,GVR,HDB,HPG,MBB,MSN,MWG,PLX,SAB,SHB,SSB,SSI,STB,TCB,TPB,VCB,VHM,VIB,VIC,VJC,VNM,VPB,VRE,DGC,PNJ,REE,KDH,DXG";

    let stocks = [];
    let selectedSymbol = null;
    let chart = null;
    let candleSeries = null;

    async function fetchBoard() {
      const statusEl = document.getElementById("status");
      try {
        statusEl.textContent = "Đang tải dữ liệu thật...";
        const res = await fetch(`${API_BASE}/api/board?symbols=${SYMBOLS}`);
        if (!res.ok) throw new Error("API lỗi");
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          stocks = data;
          statusEl.textContent = `Đã cập nhật lúc ${new Date().toLocaleTimeString("vi-VN")} • ${data.length} mã`;
          renderTable();
        } else {
          statusEl.textContent = "API trả về rỗng, đang dùng dữ liệu mẫu";
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Không kết nối được backend (có thể đang ngủ). Dùng dữ liệu mẫu.";
      }
    }

    function renderTable() {
      const tbody = document.getElementById("priceTable");
      tbody.innerHTML = "";
      stocks.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selectedSymbol === s.symbol ? "selected" : "";
        tr.onclick = () => showChart(s.symbol);
        const changeClass = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
        tr.innerHTML = `
          <td class="py-3 px-4 font-bold">${s.symbol || ""}</td>
          <td class="py-3 px-4 text-right font-medium ${changeClass}">${Number(s.price || 0).toLocaleString()}</td>
          <td class="py-3 px-4 text-right ${changeClass}">${s.change > 0 ? "+" : ""}${Number(s.change || 0).toLocaleString()}</td>
          <td class="py-3 px-4 text-right ${changeClass}">${s.percent > 0 ? "+" : ""}${Number(s.percent || 0).toFixed(2)}%</td>
          <td class="py-3 px-4 text-right">${Number(s.volume || 0).toLocaleString()}</td>
          <td class="py-3 px-4 text-right text-xs text-slate-400">${Number(s.ceiling || 0).toLocaleString()} / ${Number(s.floor || 0).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function showChart(symbol) {
      selectedSymbol = symbol;
      document.getElementById("chartTitle").textContent = `Biểu đồ nến: ${symbol}`;
      renderTable();

      const container = document.getElementById("chart");
      container.innerHTML = "";

      chart = LightweightCharts.createChart(container, {
        layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" },
        grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } },
        width: container.clientWidth,
        height: container.clientHeight
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: "#22c55e",
        downColor: "#ef4444",
        borderUpColor: "#22c55e",
        borderDownColor: "#ef4444",
        wickUpColor: "#22c55e",
        wickDownColor: "#ef4444"
      });

      try {
        const res = await fetch(`${API_BASE}/api/history/${symbol}?days=60`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          candleSeries.setData(data);
        } else {
          // fallback mẫu nếu history lỗi
          candleSeries.setData(generateSample(symbol));
        }
      } catch {
        candleSeries.setData(generateSample(symbol));
      }
      chart.timeScale().fitContent();
    }

    function generateSample(symbol) {
      const data = [];
      let price = 50;
      const now = Math.floor(Date.now() / 1000);
      for (let i = 60; i >= 0; i--) {
        const time = now - i * 86400;
        const open = price;
        const close = price + (Math.random() - 0.48) * 2;
        const high = Math.max(open, close) + Math.random();
        const low = Math.min(open, close) - Math.random();
        data.push({ time, open: +open.toFixed(2), high: +high.toFixed(2), low: +low.toFixed(2), close: +close.toFixed(2) });
        price = close;
      }
      return data;
    }

    // Khởi chạy
    fetchBoard();
    setInterval(fetchBoard, 30000); // cập nhật mỗi 30 giây
  </script>
</body>
</html>
