<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <style>
    body { background:#0f172a; color:#e2e8f0; margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    .up { color:#22c55e; } .down { color:#ef4444; } .ref { color:#facc15; }
    .hot-purple { color:#c084fc; } .hot-green { color:#22c55e; } .hot-yellow { color:#facc15; }
    tr:hover { background:#1e293b; cursor:pointer; } .selected { background:#1e3a5f !important; }
    #priceTable td, #priceTable th { padding:4px 6px; font-size:12px; white-space:nowrap; }
    #hotTable td, #hotTable th { padding:0 4px; white-space:nowrap; font-size:11px; line-height:1.05; }
    #hotTable .grp td { padding:1px 4px; }
    .info-label { color:#94a3b8; font-size:11px; }
    .tf-btn { padding:3px 10px; font-size:12px; border-radius:4px; background:#1e293b; border:1px solid #334155; cursor:pointer; color:#e2e8f0; }
    .tf-btn.active { background:#1e40af; }
    .sec-h { position:sticky; top:0; background:#111827; color:#93c5fd; font-size:11px; font-weight:700; letter-spacing:.02em; padding:6px 8px; border-bottom:1px solid #334155; }
    .flex { display:flex; } .flex-col { flex-direction:column; } .items-center { align-items:center; }
    .gap-2 { gap:8px; } .flex-1 { flex:1; } .ml-auto { margin-left:auto; }
    .px-3 { padding-left:12px; padding-right:12px; } .py-2 { padding-top:8px; padding-bottom:8px; }
    .py-1 { padding-top:4px; padding-bottom:4px; } .px-2 { padding-left:8px; padding-right:8px; }
    .border-b { border-bottom:1px solid #334155; }
    .text-base { font-size:16px; } .text-sm { font-size:14px; } .text-xs { font-size:12px; }
    .font-bold { font-weight:700; } .font-semibold { font-weight:600; }
    .bg-slate-800 { background:#1e293b; } .w-full { width:100%; } .w-24 { width:96px; }
    .text-slate-400 { color:#94a3b8; } .text-slate-500 { color:#64748b; } .text-slate-300 { color:#cbd5e1; }
    .text-blue-400 { color:#60a5fa; } .text-blue-300 { color:#93c5fd; }
    .text-left { text-align:left; } .text-right { text-align:right; } .text-center { text-align:center; }
    .sticky { position:sticky; } .top-head { top:29px; }
    .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .justify-between { justify-content:space-between; } .gap-3 { gap:12px; }
    .py-4 { padding-top:16px; padding-bottom:16px; } .mt-1 { margin-top:4px; }
    #searchInput { background:#1e293b; border:1px solid #475569; border-radius:4px; color:#e2e8f0; }
    #searchInput:focus { outline:none; border-color:#3b82f6; }
    .profile-grid { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
    .metric { display:inline-flex; align-items:baseline; gap:4px; background:#111827; border:1px solid #243044; border-radius:4px; padding:2px 7px; max-width:100%; }
    .metric .val { color:#e2e8f0; }
    .metric.grow { flex:1 1 180px; min-width:0; }
    .metric.grow .val { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .analysis-slot { margin-top:8px; max-height:178px; overflow:auto; border:1px solid #243044; border-radius:6px; padding:8px 10px; color:#cbd5e1; background:#0b1220; }
    .analysis-slot b { color:#93c5fd; font-weight:600; }
    .a-line { margin-top:3px; line-height:1.35; }
    .a-line .tag { color:#93c5fd; font-weight:600; margin-right:4px; }
    .a-plus { color:#86efac; } .a-minus { color:#fca5a5; }
    .a-src { margin-top:6px; color:#64748b; font-size:10px; }
    .a-link { color:#93c5fd; text-decoration:none; font-size:11px; }
    .col-board.locked { position: relative; cursor: pointer; }
    .col-board.locked table { filter: blur(14px); pointer-events: none; user-select: none; transition: filter 0.3s; }
    .col-board.locked.has-results {
      box-shadow: inset 0 0 40px rgba(96,165,250,0.45), 0 0 25px rgba(96,165,250,0.35);
      animation: boardGlow 2.2s ease-in-out infinite alternate;
    }
    @keyframes boardGlow {
      from { box-shadow: inset 0 0 25px rgba(96,165,250,0.25), 0 0 12px rgba(96,165,250,0.2); }
      to { box-shadow: inset 0 0 55px rgba(96,165,250,0.65), 0 0 30px rgba(96,165,250,0.5); }
    }
    .col-board.locked::after {
      content: "🔒 Nhấn để mở khóa";
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #93c5fd; font-weight: 700; font-size: 13px; text-shadow: 0 0 10px #000, 0 0 4px #000;
      pointer-events: none; z-index: 5; white-space: nowrap;
    }
    #unlockModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200; align-items:center; justify-content:center; }
    #unlockModal .box { background:#1e293b; padding:22px 20px; border-radius:12px; border:1px solid #334155; max-width:340px; width:90%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
    #unlockModal p { margin:0 0 14px; font-size:15px; }
    #unlockAnswer { width:100%; box-sizing:border-box; padding:9px 10px; background:#0f172a; border:1px solid #475569; color:#e2e8f0; border-radius:5px; margin-bottom:12px; font-size:14px; }
    #unlockAnswer:focus { outline:none; border-color:#3b82f6; }
    #unlockModal button { padding:8px 18px; background:#1e40af; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:600; }
    #unlockModal button:hover { background:#1d4ed8; }
    #unlockMsg { margin:12px 0 0; color:#fca5a5; min-height:1.3em; font-size:13px; }
    @media (min-width:768px) {
      body { overflow:hidden; height:100vh; }
      .main-layout { display:flex; height:calc(100vh - 40px); }
      .col-hot { width:336px; min-width:300px; overflow:hidden; border-right:1px solid #334155; display:flex; flex-direction:column; }
      .col-board { width:292px; min-width:240px; overflow:auto; border-right:1px solid #334155; }
      .col-hot .sec-h { position:static; flex:0 0 auto; padding:3px 6px; font-size:10px; }
      .col-hot table { flex:1 1 auto; height:100%; }
      .col-hot thead { position:static; }
      #hotTable th, #hotTable td { height:calc((100vh - 78px) / 53); font-size:clamp(8px, 1.05vh, 11px); }
      #hotTable .grp td { height:calc((100vh - 78px) / 70); font-size:9px; }
      .col-chart { flex:1; min-width:360px; display:flex; flex-direction:column; }
    }
    .tabbar { display:none; }
    @media (max-width:767px) {
      body { height:100dvh; overflow:hidden; -webkit-text-size-adjust:100%; }
      .topbar { padding-top:max(10px, env(safe-area-inset-top)); padding-bottom:10px; }
      .topbar h1 { font-size:16px; }
      #searchInput { width:100px; min-height:40px; font-size:16px; }
      #status { display:none; }
      .main-layout { display:block; height:calc(100dvh - 60px - 64px - env(safe-area-inset-bottom)); }
      .col-board, .col-hot, .col-chart { display:none; height:100%; overflow:auto; -webkit-overflow-scrolling:touch; }
      .col-board.show, .col-hot.show, .col-chart.show { display:flex; flex-direction:column; }
      .col-board.show { display:block; }
      .sec-h { position:sticky; top:0; z-index:2; font-size:13px; padding:10px 12px; }
      #priceTable td, #priceTable th, #hotTable td, #hotTable th { font-size:15px; padding:12px 8px; line-height:1.3; height:auto; }
      #hotTable .grp td { font-size:13px; padding:8px 10px; height:auto; }
      .col-hot table, .col-hot thead { height:auto; position:static; }
      .col-chart { min-width:0; }
      #companyPanel { font-size:14px; flex:0 0 auto; padding:10px 12px; }
      .analysis-slot { max-height:180px; font-size:13px; }
      #chart { min-height:280px; flex:1 1 auto; }
      .tf-btn { min-height:40px; padding:8px 14px; font-size:15px; }
      .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; background:#0b1220; border-top:1px solid #334155; padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 10px rgba(0,0,0,.4); }
      .tabbar button { flex:1; min-height:56px; background:transparent; color:#94a3b8; border:0; font-size:14px; font-weight:600; }
      .tabbar button.active { color:#93c5fd; background:#1e293b; }
      #unlockModal .box { padding:28px 20px; max-width:320px; }
      #unlockAnswer { min-height:44px; font-size:16px; }
      #unlockModal button { min-height:44px; font-size:15px; padding:10px 20px; }
    }
    @media (max-width:480px) {
      #priceTable th:nth-child(3), #priceTable td:nth-child(3),
      #hotTable th:nth-child(4), #hotTable td:nth-child(4) { display:none; } /* ẩn cột TB cho màn nhỏ */
      .topbar h1 { font-size:15px; }
    }
  </style>
</head>
<body class="flex flex-col">
  <div class="topbar px-3 py-2 border-b flex items-center gap-2">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" placeholder="Tìm mã..." class="px-2 py-1 text-sm w-24" />
    <p id="status" class="text-xs text-slate-400 ml-auto">Đang tải...</p>
  </div>
  <div class="main-layout">
    <div class="col-hot">
      <div class="sec-h" id="hotTitle">Bảng giá · 35 HSX + 15 HNX tăng mạnh</div>
      <table class="w-full">
        <thead class="bg-slate-800 sticky top-head text-xs">
          <tr><th class="text-left">Mã</th><th class="text-left">Sàn</th><th class="text-right">Giá</th><th class="text-right">TB</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr>
        </thead>
        <tbody id="hotTable"></tbody>
      </table>
    </div>
    <div class="col-board">
      <div class="sec-h">Danh sách lọc</div>
      <table class="w-full">
        <thead class="bg-slate-800 sticky top-head text-xs">
          <tr><th class="text-left">Mã</th><th class="text-right">Giá</th><th class="text-right">TB</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>
    <div class="col-chart">
      <div class="px-3 py-1 border-b flex gap-2 items-center">
        <span id="chartTitle" class="text-xs text-slate-400">Chart</span>
        <button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button>
        <button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button>
        <button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button>
      </div>
      <div id="companyPanel" class="px-3 py-2 border-b text-xs"><span class="text-slate-500">Chọn mã để xem thông tin</span></div>
      <div id="chart" class="flex-1" style="min-height:240px"></div>
    </div>
  </div>
  <div id="unlockModal">
    <div class="box">
      <p>Họ tên viết tắt chủ trang?</p>
      <input id="unlockAnswer" placeholder="Nhập câu trả lời" maxlength="10" autocomplete="off" />
      <button type="button" onclick="checkUnlock()">Xác nhận</button>
      <p id="unlockMsg"></p>
    </div>
  </div>
  <nav class="tabbar" aria-label="Chuyển khung">
    <button type="button" class="active" data-tab="board" onclick="showTab('board')">Lọc</button>
    <button type="button" data-tab="hot" onclick="showTab('hot')">Nóng</button>
    <button type="button" data-tab="chart" onclick="showTab('chart')">Chart</button>
  </nav>
  <script defer src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const VPS = "https://bgapidatafeed.vps.com.vn/getliststockdata";
    const VPS_LIST = "https://bgapidatafeed.vps.com.vn/getlistallstock";
    const API = "https://skystock-api-1.onrender.com";
    const PROFILE = "https://api.simplize.vn/api/company/summary";
    const QUOTE_TTL = 8000;
    const LIST_TTL = 60 * 1000;
    let closedReady = false;
    let hotMode = "prev";
    let symbols = [], stocks = [], filtered = [], selected = null, profiles = {};
    let universe = [], hot = [], hotDate = "", chart = null, candleSeries = null, volumeSeries = null;
    let rawHistory = [], currentTF = "D", fittedSymbol = "";
    let listLoadedAt = 0, prevLoaded = false, hotInflight = null, boardInflight = null;
    const quoteCache = new Map();
    const historyCache = new Map();
    const aggCache = new Map();
    let historyAbort = null;
    let profileAbort = null;
    let boardUnlocked = false;

    function getUnlockPeriodKey() {
      const now = vnNow();
      const totalMin = now.getHours() * 60 + now.getMinutes();
      // Chu kỳ 3 tiếng, bắt đầu từ 8:00 sáng
      let minutesFrom8 = totalMin - 8 * 60;
      if (minutesFrom8 < 0) minutesFrom8 += 24 * 60;
      const period = Math.floor(minutesFrom8 / 180);
      return dateKey(now) + ":" + period;
    }
    function refreshUnlockState() {
      try {
        const stored = localStorage.getItem("skystockBoardUnlockPeriod");
        boardUnlocked = stored === getUnlockPeriodKey();
      } catch {
        boardUnlocked = false;
      }
      updateBoardLock();
    }
    function updateBoardLock() {
      const el = document.querySelector(".col-board");
      if (!el) return;
      el.classList.toggle("locked", !boardUnlocked);
      el.classList.toggle("has-results", !boardUnlocked && filtered.length > 0);
    }
    function showUnlockModal() {
      const m = document.getElementById("unlockModal");
      if (!m) return;
      m.style.display = "flex";
      const inp = document.getElementById("unlockAnswer");
      inp.value = "";
      document.getElementById("unlockMsg").textContent = "";
      setTimeout(() => inp.focus(), 50);
    }
    function checkUnlock() {
      const ans = (document.getElementById("unlockAnswer").value || "").trim().toUpperCase();
      if (ans === "NK") {
        boardUnlocked = true;
        try { localStorage.setItem("skystockBoardUnlockPeriod", getUnlockPeriodKey()); } catch {}
        document.getElementById("unlockModal").style.display = "none";
        updateBoardLock();
      } else {
        document.getElementById("unlockMsg").textContent = "Chúc bạn may mắn lần sau";
      }
    }
    function setupBoardLock() {
      const el = document.querySelector(".col-board");
      if (!el) return;
      refreshUnlockState();
      el.addEventListener("click", (e) => {
        if (boardUnlocked) return;
        e.stopPropagation();
        showUnlockModal();
      });
      const inp = document.getElementById("unlockAnswer");
      if (inp) inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); checkUnlock(); }
      });
      document.getElementById("unlockModal").addEventListener("click", (e) => {
        if (e.target.id === "unlockModal") document.getElementById("unlockModal").style.display = "none";
      });
      // Kiểm tra lại mỗi phút phòng khi đang mở trang qua mốc 3 tiếng
      setInterval(refreshUnlockState, 60 * 1000);
    }

    function toVnd(v) { const n = Number(v); if (!n) return 0; return n < 1000 ? Math.round(n * 1000) : Math.round(n); }
    function num(v, d = 0) { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString("vi-VN", { maximumFractionDigits: d }) : "—"; }
    function ty(v) { const n = Number(v); if (!n) return "—"; return (n / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 0 }) + " tỷ"; }
    function mapVps(row, floor) {
      const last = Number(row.lastPrice || 0), ref = Number(row.r || 0);
      const traded = last > 0 && ref > 0;
      const px = traded ? last : Number(row.closePrice || 0);
      return {
        symbol: row.sym,
        floor: floor || row.mc || "",
        price: toVnd(px),
        change: traded ? (last - ref) * 1000 : 0,
        percent: traded ? (last - ref) / ref * 100 : 0,
        volume: Number(row.lot || 0) * 10,
        avg: toVnd(row.avePrice || row.avg || 0),
        ceiling: toVnd(row.c),
        floorPrice: toVnd(row.f)
      };
    }
    function vnNow() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" })); }
    function pad(n) { return String(n).padStart(2, "0"); }
    function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function dateLabel(d) { return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; }
    function prevTradingDay(d) {
      const x = new Date(d.getTime());
      x.setDate(x.getDate() - 1);
      while (x.getDay() === 0 || x.getDay() === 6) x.setDate(x.getDate() - 1);
      return x;
    }
    function inSession() {
      const d = vnNow();
      const day = d.getDay();
      if (day === 0 || day === 6) return false;
      const m = d.getHours() * 60 + d.getMinutes();
      return (m >= 9 * 60 && m <= 11 * 60 + 30) || (m >= 13 * 60 && m <= 14 * 60 + 45);
    }
    // Phiên đóng cửa gần nhất: nghỉ trưa / đang chiều = đóng cửa sáng; sau 14:45, ngoài giờ, cuối tuần = đóng cửa chiều.
    function closedSession() {
      const d = vnNow();
      const day = d.getDay();
      const m = d.getHours() * 60 + d.getMinutes();
      if (day === 0 || day === 6) {
        const fri = prevTradingDay(d);
        return { kind: "pm", when: fri, label: `Đóng cửa chiều ${dateLabel(fri)}` };
      }
      if (m > 11 * 60 + 30 && m < 14 * 60 + 45) {
        return { kind: "am", when: d, label: `Đóng cửa sáng ${dateLabel(d)}` };
      }
      if (m >= 14 * 60 + 45) return { kind: "pm", when: d, label: `Đóng cửa chiều ${dateLabel(d)}` };
      const prev = prevTradingDay(d);
      return { kind: "pm", when: prev, label: `Đóng cửa chiều ${dateLabel(prev)}` };
    }
    async function fetchQuotes(list) {
      const now = Date.now();
      const fresh = [];
      const need = [];
      list.forEach(sym => {
        const hit = quoteCache.get(sym);
        if (hit && now - hit.ts < QUOTE_TTL) fresh.push(hit.row);
        else need.push(sym);
      });
      for (let i = 0; i < need.length; i += 60) {
        const res = await fetch(`${VPS}/${need.slice(i, i + 60).join(",")}`);
        if (!res.ok) continue;
        const rows = await res.json();
        const ts = Date.now();
        rows.forEach(r => quoteCache.set(r.sym, { ts, row: r }));
        fresh.push(...rows);
      }
      return fresh;
    }
    let lastBoardAt = 0;
    let scanUpdated = "";
    async function loadList(force) {
      if (!force && symbols.length && !inSession()) return;
      if (!force && symbols.length && Date.now() - listLoadedAt < LIST_TTL) return;
      const urls = [
        `https://raw.githubusercontent.com/skynel2417/skystock/main/scan.json?t=${Date.now()}`,
        `scan.json?t=${Date.now()}`
      ];
      let data = null;
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          const body = await res.json();
          if (body && Array.isArray(body.symbols)) { data = body; break; }
        } catch {}
      }
      if (!data) return;
      symbols = (data.symbols || []).map(s => String(s).toUpperCase());
      scanUpdated = data.updated || "";
      listLoadedAt = Date.now();
    }
    async function loadUniverse() {
      if (universe.length) return;
      const res = await fetch(VPS_LIST);
      const data = await res.json();
      universe = data.filter(x => x.type === "S" && /^[A-Z]{3}$/.test(x.stock_code) && (x.post_to === "HOSE" || x.post_to === "HNX"))
        .map(x => ({ symbol: x.stock_code, floor: x.post_to === "HOSE" ? "HSX" : "HNX" }));
    }
    function setStatus() {
      const phase = closedSession().label;
      const scanAt = scanUpdated ? scanUpdated.slice(11, 16) : "--:--";
      document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${phase} • lọc ${filtered.length} • scan ${scanAt} • nóng ${hot.length}`;
    }
    async function fetchBoard(force) {
      if (!force && !inSession() && stocks.length) { setStatus(); return; }
      if (boardInflight) return boardInflight;
      boardInflight = (async () => {
        if (!symbols.length) { stocks = []; applyFilter(); }
        else {
          const rows = await fetchQuotes(symbols);
          const got = new Map(rows.map(r => [r.sym, mapVps(r)]));
          const next = symbols.map(s => got.get(s) || { symbol: s, price: 0, change: 0, percent: 0, volume: 0 });
          if (boardChanged(next)) { stocks = next; applyFilter(); }
        }
        setStatus();
      })();
      try { await boardInflight; } finally { boardInflight = null; }
    }
    function boardChanged(next) {
      if (next.length !== stocks.length) return true;
      return next.some((s, i) => s.symbol !== stocks[i].symbol || s.price !== stocks[i].price || s.avg !== stocks[i].avg || s.change !== stocks[i].change || s.volume !== stocks[i].volume);
    }
    function rankHot(list) {
      const top = (floor, n) => list.filter(s => s.floor === floor && s.percent >= 2 && Number(s.volume) > 10000).sort((a, b) => b.percent - a.percent || b.change - a.change).slice(0, n);
      return [...top("HSX", 35), ...top("HNX", 15)];
    }
    function hotCls(percent) {
      if (percent >= 6.5) return "hot-purple";
      if (percent > 4) return "hot-green";
      return "hot-yellow";
    }
    function snapKey(session) { return `hot-close:${session.kind}:${dateKey(session.when)}`; }
    function readSnap(session) {
      try {
        const raw = localStorage.getItem(snapKey(session));
        if (!raw) return null;
        const saved = JSON.parse(raw);
        return Array.isArray(saved.rows) && saved.rows.length ? saved : null;
      } catch { return null; }
    }
    function writeSnap(session, rows) {
      try {
        localStorage.setItem(snapKey(session), JSON.stringify({ date: dateLabel(session.when), kind: session.kind, rows }));
      } catch {}
    }
    async function fetchPrevHot() {
      if (prevLoaded && hot.length && hotMode === "prev") { renderHot(); return; }
      const res = await fetch(`prev.json?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error("prev");
      const saved = await res.json();
      hot = rankHot(saved.rows || []);
      hotMode = "prev";
      hotDate = saved.date || "";
      prevLoaded = true;
      renderHot();
      setStatus();
    }
    async function fetchClosedHot() {
      if (hotInflight) return hotInflight;
      hotInflight = (async () => {
        const session = closedSession();
        const cached = readSnap(session);
        const clock = vnNow();
        const mins = clock.getHours() * 60 + clock.getMinutes();
        const day = clock.getDay();
        const weekend = day === 0 || day === 6;
        const lunch = !weekend && mins > 11 * 60 + 30 && mins < 13 * 60;
        const afterClose = !weekend && mins >= 14 * 60 + 45;
        const beforeOpen = !weekend && mins < 9 * 60;
        const feedIsThisClose = (session.kind === "am" && lunch) || (session.kind === "pm" && (afterClose || beforeOpen || weekend));
        if (cached && !feedIsThisClose) {
          hot = rankHot(cached.rows);
          hotMode = "close";
          hotDate = session.label;
          renderHot();
          setStatus();
          return;
        }
        if (!feedIsThisClose) {
          if (cached) {
            hot = rankHot(cached.rows);
            hotMode = "close";
            hotDate = session.label;
            renderHot();
            setStatus();
            return;
          }
          await fetchPrevHot();
          return;
        }
        if (!universe.length) await loadUniverse();
        const floorOf = new Map(universe.map(x => [x.symbol, x.floor]));
        const rows = await fetchQuotes(universe.map(x => x.symbol));
        const mapped = rows.map(r => mapVps(r, floorOf.get(r.sym))).filter(s => s.price > 0);
        const ranked = rankHot(mapped);
        if (ranked.length) {
          writeSnap(session, mapped);
          hot = ranked;
          hotMode = "close";
          hotDate = session.label;
          renderHot();
          setStatus();
          return;
        }
        if (cached) {
          hot = rankHot(cached.rows);
          hotMode = "close";
          hotDate = session.label;
          renderHot();
          setStatus();
          return;
        }
        await fetchPrevHot();
      })();
      try { await hotInflight; } finally { hotInflight = null; }
    }
    function applyFilter() {
      const q = document.getElementById("searchInput").value.trim().toUpperCase();
      filtered = stocks.filter(s => !q || s.symbol.includes(q));
      renderTable();
    }
    function sig(s) { return [s.price, s.avg || 0, s.change, s.percent, s.volume, s.floor || ""].join("|"); }
    function cells(s, withFloor) {
      const cls = withFloor ? hotCls(Number(s.percent || 0)) : (s.change > 0 ? "up" : s.change < 0 ? "down" : "ref");
      const avg = Number(s.avg || 0);
      const avgTxt = avg ? avg.toLocaleString("vi-VN") : "—";
      return `<td class="font-bold ${withFloor ? cls : ""}">${s.symbol}</td>${withFloor ? `<td class="text-slate-400">${s.floor || ""}</td>` : ""}<td class="text-right ${cls}">${Number(s.price || 0).toLocaleString("vi-VN")}</td><td class="text-right text-slate-300">${avgTxt}</td><td class="text-right ${cls}">${s.change > 0 ? "+" : ""}${Number(s.change || 0).toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.percent > 0 ? "+" : ""}${Number(s.percent || 0).toFixed(2)}</td><td class="text-right text-slate-500">${(Number(s.volume || 0) / 1000).toFixed(0)}K</td>`;
    }
    function paint(tr, s, withFloor) {
      const next = sig(s);
      if (tr.dataset.sig !== next) { tr.innerHTML = cells(s, withFloor); tr.dataset.sig = next; }
      tr.classList.toggle("selected", selected === s.symbol);
    }
    function renderTable() {
      const tb = document.getElementById("priceTable");
      const scroller = tb.closest(".col-board");
      const top = scroller ? scroller.scrollTop : 0;
      if (!filtered.length) {
        tb.innerHTML = `<tr><td colspan="6" class="text-slate-500 text-center py-4">Chưa có mã</td></tr>`;
        updateBoardLock();
        return;
      }
      const existing = new Map([...tb.querySelectorAll("tr[data-sym]")].map(tr => [tr.dataset.sym, tr]));
      const frag = document.createDocumentFragment();
      filtered.forEach(s => {
        let tr = existing.get(s.symbol);
        if (!tr) {
          tr = document.createElement("tr");
          tr.dataset.sym = s.symbol;
          tr.onclick = () => selectStock(s);
        }
        paint(tr, s, false);
        frag.appendChild(tr);
      });
      tb.replaceChildren(frag);
      if (scroller) scroller.scrollTop = top;
      updateBoardLock();
    }
    function renderHot() {
      const tb = document.getElementById("hotTable");
      const scroller = tb.closest(".col-hot");
      const top = scroller ? scroller.scrollTop : 0;
      document.getElementById("hotTitle").textContent = `${hotDate || "Phiên đóng cửa gần nhất"} · 35 HSX + 15 HNX · từ 2%`;
      if (!hot.length) {
        tb.innerHTML = `<tr><td colspan="7" class="text-slate-500 text-center py-4">Đang tải giá đóng cửa phiên gần nhất...</td></tr>`;
        return;
      }
      const existing = new Map([...tb.querySelectorAll("tr[data-sym]")].map(tr => [tr.dataset.sym, tr]));
      const frag = document.createDocumentFragment();
      let last = "";
      hot.forEach(s => {
        if (s.floor !== last) {
          last = s.floor;
          const hr = document.createElement("tr");
          hr.className = "grp";
          hr.innerHTML = `<td colspan="7" class="bg-slate-800 text-blue-300 font-semibold">${s.floor === "HSX" ? "HSX · tăng mạnh" : "HNX · tăng mạnh"}</td>`;
          frag.appendChild(hr);
        }
        let tr = existing.get(s.symbol);
        if (!tr) {
          tr = document.createElement("tr");
          tr.dataset.sym = s.symbol;
          tr.onclick = () => selectStock(s);
        }
        paint(tr, s, true);
        frag.appendChild(tr);
      });
      tb.replaceChildren(frag);
      if (scroller) scroller.scrollTop = top;
    }
    function markSelected() {
      document.querySelectorAll("#priceTable tr[data-sym], #hotTable tr[data-sym]").forEach(tr => {
        tr.classList.toggle("selected", tr.dataset.sym === selected);
      });
    }
    function showTab(name) {
      document.querySelector(".col-board").classList.toggle("show", name === "board");
      document.querySelector(".col-hot").classList.toggle("show", name === "hot");
      document.querySelector(".col-chart").classList.toggle("show", name === "chart");
      document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    }
    function ensureChart() {
      if (chart || !window.LightweightCharts) return;
      const el = document.getElementById("chart");
      chart = LightweightCharts.createChart(el, { layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" }, grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } }, autoSize: true });
      candleSeries = chart.addCandlestickSeries({ upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444" });
      volumeSeries = chart.addHistogramSeries({ color: "#334155", priceFormat: { type: "volume" }, priceScaleId: "" });
      volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    }
    function cplh(v) {
      const n = Number(v);
      if (!n) return "—";
      if (n >= 1e9) return (n / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 2 }) + " tỷ";
      if (n >= 1e6) return (n / 1e6).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + " tr";
      return n.toLocaleString("vi-VN");
    }
    function metric(label, value, grow) {
      return `<span class="metric${grow ? " grow" : ""}"><span class="info-label">${label}</span><span class="val">${value}</span></span>`;
    }
    function renderProfile(stock, profile) {
      const cls = stock.change > 0 ? "up" : stock.change < 0 ? "down" : "ref";
      const p = profile || {};
      const industry = p.industry || p.sector || "—";
      document.getElementById("companyPanel").innerHTML = `<div class="flex items-baseline gap-2"><span class="text-sm font-bold text-blue-400">${stock.symbol}</span><span class="${cls}">${num(stock.price)} (${stock.change > 0 ? "+" : ""}${num(stock.percent, 2)}%)</span><span class="text-slate-300 truncate">${p.name || "Đang tải tên doanh nghiệp..."}</span></div><div class="profile-grid mt-1">${metric("Ngành", industry, true)}${metric("EPS", num(p.eps, 0))}${metric("P/E", num(p.pe, 2))}${metric("Vốn hóa", ty(p.mcap))}${metric("CPLH", cplh(p.shares))}</div><div id="analysisSlot" class="analysis-slot"><b>Phân tích</b><div class="mt-1">Đang tóm tắt...</div></div>`;
      renderAnalysis(stock, p);
    }
    let analysisNotes = null;
    function chatPrompt(stock, profile) {
      const name = (profile && profile.name) || stock.symbol;
      return `Tìm hiểu cổ phiếu ${stock.symbol} - ${name}. Nêu mảng kinh doanh đóng góp chủ đạo vào doanh thu và lợi nhuận. Định giá thận trọng cổ phiếu. Các thông tin đáng chú ý ảnh hưởng ngắn hạn, cả tích cực lẫn tiêu cực. Mục tiêu giá ngắn hạn. Trả lời tiếng Việt, ngắn gọn, có số liệu nếu có, không phải khuyến nghị mua bán.`;
    }
    function chatUrl(stock, profile) {
      return "https://chatgpt.com/?q=" + encodeURIComponent(chatPrompt(stock, profile));
    }
    async function loadAnalysisNotes() {
      if (analysisNotes) return analysisNotes;
      const urls = [`analysis.json?t=${Date.now()}`, `https://raw.githubusercontent.com/skynel2417/skystock/main/analysis.json?t=${Date.now()}`];
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) continue;
          analysisNotes = await res.json();
          return analysisNotes;
        } catch {}
      }
      analysisNotes = { notes: {} };
      return analysisNotes;
    }
    async function renderAnalysis(stock, profile) {
      const notes = await loadAnalysisNotes();
      const note = (notes.notes || {})[stock.symbol] || {};
      const slot = document.getElementById("analysisSlot");
      if (!slot) return;
      const lines = [];
      if (note.biz) lines.push(`<div class="a-line"><span class="tag">Mảng KD</span>${note.biz}</div>`);
      if (note.val) lines.push(`<div class="a-line"><span class="tag">Định giá</span>${note.val}</div>`);
      if (note.pos) lines.push(`<div class="a-line a-plus"><span class="tag">Tích cực</span>${note.pos}</div>`);
      if (note.neg) lines.push(`<div class="a-line a-minus"><span class="tag">Tiêu cực</span>${note.neg}</div>`);
      if (note.tgt) lines.push(`<div class="a-line"><span class="tag">Mục tiêu</span>${note.tgt}</div>`);
      slot.innerHTML = `<b>Phân tích</b>${lines.length ? lines.join("") : "<div class=\"mt-1\">Chưa có bản tóm tắt cho " + stock.symbol + ".</div>"}<div class="a-src"><a class="a-link" href="${chatUrl(stock, profile)}" target="_blank" rel="noopener">Hỏi ChatGPT để chạy prompt mảng kinh doanh, định giá thận trọng, tin ngắn hạn và mục tiêu giá.</a></div>`;
    }
    function normalizeBar(b) {
      return { time: b.time || b.t, open: Number(b.open || b.o), high: Number(b.high || b.h), low: Number(b.low || b.l), close: Number(b.close || b.c), volume: Number(b.volume || b.v || 0) };
    }
    async function loadProfile(symbol, signal) {
      if (profiles[symbol]) return profiles[symbol];
      const res = await fetch(`${PROFILE}/${symbol}`, { signal });
      if (!res.ok) return null;
      const data = (await res.json()).data || {};
      profiles[symbol] = { name: data.nameVi || data.name || symbol, sector: data.bcEconomicSectorName || "", industry: data.industryActivity || "", eps: data.epsRatio, pe: data.peRatio, mcap: data.marketCap, shares: data.outstandingSharesValue };
      return profiles[symbol];
    }
    async function selectStock(stock) {
      selected = stock.symbol;
      if (window.matchMedia("(max-width:767px)").matches) showTab("chart");
      markSelected();
      document.getElementById("chartTitle").textContent = stock.symbol;
      renderProfile(stock, profiles[stock.symbol]);
      if (profileAbort) profileAbort.abort();
      profileAbort = new AbortController();
      const profileTask = loadProfile(stock.symbol, profileAbort.signal).then(p => { if (selected === stock.symbol) renderProfile(stock, p); }).catch(() => {});
      if (historyCache.has(stock.symbol)) rawHistory = historyCache.get(stock.symbol);
      else {
        if (historyAbort) historyAbort.abort();
        historyAbort = new AbortController();
        try {
          const res = await fetch(`${API}/api/history/${stock.symbol}?days=160`, { signal: historyAbort.signal });
          const data = await res.json();
          rawHistory = Array.isArray(data) ? data.map(normalizeBar) : [];
          if (selected === stock.symbol) historyCache.set(stock.symbol, rawHistory);
        } catch (err) {
          if (err.name === "AbortError") return;
          rawHistory = [];
        }
      }
      if (selected !== stock.symbol) return;
      currentTF = "D";
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === "D"));
      if (rawHistory.length) drawChart(fittedSymbol !== stock.symbol);
      await profileTask;
    }
    function changeTimeframe(tf) {
      currentTF = tf;
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf));
      if (selected && rawHistory.length) drawChart(false);
    }
    function drawChart(fit) {
      if (!candleSeries || !rawHistory.length) return;
      const data = aggregate(rawHistory, currentTF);
      candleSeries.setData(data);
      if (volumeSeries) volumeSeries.setData(data.map(d => ({ time: d.time, value: d.volume || 0, color: d.close >= d.open ? "#22c55e55" : "#ef444455" })));
      if (fit) { chart.timeScale().fitContent(); fittedSymbol = selected; }
    }
    function aggregate(data, tf) {
      if (tf === "D") return data;
      const groups = new Map();
      data.forEach(d => {
        const dt = new Date(d.time * 1000);
        let k;
        if (tf === "W") {
          const day = dt.getUTCDay();
          const diff = (day + 6) % 7;
          dt.setUTCDate(dt.getUTCDate() - diff);
          k = dt.toISOString().slice(0, 10);
        } else {
          k = `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}`;
        }
        if (!groups.has(k)) groups.set(k, { time: d.time, open: d.open, high: d.high, low: d.low, close: d.close, volume: d.volume || 0 });
        else {
          const g = groups.get(k);
          g.high = Math.max(g.high, d.high);
          g.low = Math.min(g.low, d.low);
          g.close = d.close;
          g.volume += d.volume || 0;
        }
      });
      return [...groups.values()].sort((a, b) => a.time - b.time);
    }
    document.getElementById("searchInput").addEventListener("input", applyFilter);
    if (window.matchMedia("(max-width:767px)").matches) showTab("hot");
    async function refreshBoard(force) {
      const due = inSession() ? 60 * 1000 : 60 * 60 * 1000;
      if (!force && stocks.length && Date.now() - lastBoardAt < due) return;
      await loadList(true);
      await fetchBoard(true);
      lastBoardAt = Date.now();
    }
    let hotSessionKey = "";
    async function tick() {
      try {
        const session = closedSession();
        const key = snapKey(session);
        const due = key !== hotSessionKey || !hot.length;
        hotSessionKey = key;
        if (due) await fetchClosedHot();
        if (inSession()) {
          closedReady = false;
          await refreshBoard(false);
          setTimeout(tick, 60000);
          return;
        }
        await refreshBoard(!closedReady);
        closedReady = true;
        setStatus();
      } catch { document.getElementById("status").textContent = "Lỗi tải dữ liệu"; }
      setTimeout(tick, 60000);
    }
    function boot() {
      setupBoardLock();
      ensureChart();
      tick();
    }
    if (document.readyState === "complete") boot();
    else window.addEventListener("load", boot);
  </script>
</body>
