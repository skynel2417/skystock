<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold mb-2 text-center">Bảng giá Chứng khoán Việt Nam</h1>
    <p class="text-center text-slate-400 mb-6 text-sm">Dữ liệu demo gần realtime • Cập nhật mỗi 15 giây • Click mã để xem chart nến</p>

    <!-- Bảng giá -->
    <div class="overflow-x-auto rounded-xl border border-slate-700 bg-slate-900">
      <table class="w-full text-sm">
        <thead class="bg-slate-800 text-slate-300">
          <tr>
            <th class="py-3 px-4 text-left">Mã</th>
            <th class="py-3 px-4 text-right">Giá</th>
            <th class="py-3 px-4 text-right">±</th>
            <th class="py-3 px-4 text-right">%</th>
            <th class="py-3 px-4 text-right">Khối lượng</th>
            <th class="py-3 px-4 text-right">Trần / Sàn</th>
          </tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>

    <!-- Chart -->
    <div class="mt-8">
      <h2 id="chartTitle" class="text-xl font-semibold mb-3">Biểu đồ nến: Chọn một mã ở trên</h2>
      <div id="chart" class="w-full h-80 md:h-96 rounded-xl border border-slate-700 bg-slate-900"></div>
    </div>

    <p class="text-center text-xs text-slate-500 mt-8">
      Đây là phiên bản demo. Dữ liệu đang dùng mẫu mô phỏng. Sau này có thể nâng cấp lên dữ liệu thật.
    </p>
  </div>

  <script>
    // ===== Dữ liệu mẫu (mô phỏng gần realtime) =====
    const stocks = [
      { symbol: "VCB", name: "Vietcombank", price: 91200, change: 400, percent: 0.44, volume: 1250000, ceiling: 97500, floor: 84900 },
      { symbol: "FPT", name: "FPT Corp", price: 112500, change: 2500, percent: 2.27, volume: 980000, ceiling: 120000, floor: 105000 },
      { symbol: "VNM", name: "Vinamilk", price: 67800, change: -200, percent: -0.29, volume: 750000, ceiling: 72500, floor: 63100 },
      { symbol: "HPG", name: "Hòa Phát", price: 29400, change: 450, percent: 1.55, volume: 2100000, ceiling: 31400, floor: 27400 },
      { symbol: "TCB", name: "Techcombank", price: 24500, change: 300, percent: 1.24, volume: 1850000, ceiling: 26200, floor: 22800 },
      { symbol: "SSI", name: "SSI Securities", price: 34200, change: 700, percent: 2.09, volume: 3200000, ceiling: 36600, floor: 31800 },
      { symbol: "MWG", name: "Mobile World", price: 58500, change: -800, percent: -1.35, volume: 1100000, ceiling: 62500, floor: 54500 },
      { symbol: "VIC", name: "Vingroup", price: 42500, change: 100, percent: 0.24, volume: 890000, ceiling: 45500, floor: 39500 },
      { symbol: "GAS", name: "PV Gas", price: 78500, change: -500, percent: -0.63, volume: 450000, ceiling: 84000, floor: 73000 },
      { symbol: "MSN", name: "Masan", price: 71200, change: 1200, percent: 1.71, volume: 670000, ceiling: 76200, floor: 66200 }
    ];

    let selectedSymbol = null;
    let chart = null;
    let candleSeries = null;

    // Tạo bảng giá
    function renderTable() {
      const tbody = document.getElementById("priceTable");
      tbody.innerHTML = "";
      stocks.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selectedSymbol === s.symbol ? "selected" : "";
        tr.onclick = () => showChart(s.symbol);
        const changeClass = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
        tr.innerHTML = `
          <td class="py-3 px-4 font-bold">${s.symbol}</td>
          <td class="py-3 px-4 text-right font-medium ${changeClass}">${s.price.toLocaleString()}</td>
          <td class="py-3 px-4 text-right ${changeClass}">${s.change > 0 ? "+" : ""}${s.change.toLocaleString()}</td>
          <td class="py-3 px-4 text-right ${changeClass}">${s.percent > 0 ? "+" : ""}${s.percent.toFixed(2)}%</td>
          <td class="py-3 px-4 text-right">${s.volume.toLocaleString()}</td>
          <td class="py-3 px-4 text-right text-xs text-slate-400">${s.ceiling.toLocaleString()} / ${s.floor.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Tạo dữ liệu nến mẫu (30 ngày)
    function generateCandleData(symbol) {
      const data = [];
      let price = stocks.find(s => s.symbol === symbol)?.price / 1000 || 50;
      const now = Math.floor(Date.now() / 1000);
      for (let i = 30; i >= 0; i--) {
        const time = now - i * 86400;
        const open = price;
        const close = price + (Math.random() - 0.48) * 2;
        const high = Math.max(open, close) + Math.random() * 1.2;
        const low = Math.min(open, close) - Math.random() * 1.2;
        data.push({ time, open: +open.toFixed(2), high: +high.toFixed(2), low: +low.toFixed(2), close: +close.toFixed(2) });
        price = close;
      }
      return data;
    }

    // Hiện chart
    function showChart(symbol) {
      selectedSymbol = symbol;
      document.getElementById("chartTitle").textContent = `Biểu đồ nến: ${symbol}`;
      renderTable();

      const container = document.getElementById("chart");
      container.innerHTML = "";

      chart = LightweightCharts.createChart(container, {
        layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" },
        grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } },
        width: container.clientWidth,
        height: container.clientHeight
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: "#22c55e",
        downColor: "#ef4444",
        borderUpColor: "#22c55e",
        borderDownColor: "#ef4444",
        wickUpColor: "#22c55e",
        wickDownColor: "#ef4444"
      });

      candleSeries.setData(generateCandleData(symbol));
      chart.timeScale().fitContent();

      window.addEventListener("resize", () => {
        chart.applyOptions({ width: container.clientWidth });
      });
    }

    // Mô phỏng giá thay đổi nhẹ mỗi 15 giây
    function updatePrices() {
      stocks.forEach(s => {
        const delta = Math.round((Math.random() - 0.5) * 400);
        s.price = Math.max(s.floor, Math.min(s.ceiling, s.price + delta));
        s.change = s.price - (s.price - delta); // tạm
        s.percent = +(s.change / (s.price - s.change) * 100).toFixed(2);
        s.volume += Math.floor(Math.random() * 50000);
      });
      renderTable();
    }

    // Khởi chạy
    renderTable();
    setInterval(updatePrices, 15000);
  </script>
</body>
</html>
