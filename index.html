<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; overflow: hidden; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 3px 5px; font-size: 11px; white-space: nowrap; }
    .info-label { color: #94a3b8; font-size: 11px; }
    .info-value { color: #e2e8f0; font-size: 12px; font-weight: 500; }
    .tf-btn { padding: 2px 8px; font-size: 11px; border-radius: 4px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .tf-btn.active { background: #1e40af; border-color: #3b82f6; }
  </style>
</head>
<body class="h-screen flex flex-col">
  <div class="px-3 py-1.5 border-b border-slate-700 flex items-center gap-3 flex-shrink-0">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" type="text" placeholder="Tìm mã..." class="bg-slate-800 border border-slate-600 rounded px-2 py-0.5 text-xs w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto"></p>
  </div>

  <div class="flex-1 flex overflow-hidden">
    <!-- Bảng giá -->
    <div class="w-64 flex-shrink-0 overflow-auto border-r border-slate-700">
      <table class="w-full">
        <thead class="bg-slate-800 text-slate-300 sticky top-0 text-xs">
          <tr>
            <th class="text-left">Mã</th>
            <th class="text-right">Giá</th>
            <th class="text-right">±</th>
            <th class="text-right">%</th>
            <th class="text-right">KL</th>
          </tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>

    <!-- Thông tin DN -->
    <div class="w-72 flex-shrink-0 overflow-auto border-r border-slate-700 bg-slate-900/40 p-3">
      <div id="companyPanel">
        <p class="text-slate-500 text-sm text-center mt-10">Chọn một mã bên trái<br>để xem thông tin doanh nghiệp</p>
      </div>
    </div>

    <!-- Chart -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="px-3 py-1.5 border-b border-slate-700 flex items-center gap-2">
        <span id="chartTitle" class="text-xs text-slate-400 mr-2">Chart</span>
        <button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button>
        <button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button>
        <button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button>
      </div>
      <div id="chart" class="flex-1"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://skystock-api-1.onrender.com";
    const SYMBOLS = "ACB,BCM,BID,BVH,CTG,FPT,GAS,GVR,HDB,HPG,MBB,MSN,MWG,PLX,SAB,SHB,SSB,SSI,STB,TCB,TPB,VCB,VHM,VIB,VIC,VJC,VNM,VPB,VRE,DGC,PNJ,REE,KDH,DXG";

    let stocks = [], filteredStocks = [], selectedSymbol = null;
    let chart = null, candleSeries = null, volumeSeries = null;
    let rawHistory = [];   // dữ liệu gốc 1D
    let currentTF = "D";

    async function fetchBoard() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(`${API_BASE}/api/board?symbols=${SYMBOLS}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          stocks = data;
          applyFilter();
          statusEl.textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filteredStocks.length} mã`;
        }
      } catch { statusEl.textContent = "Lỗi kết nối backend"; }
    }

    function applyFilter() {
      const keyword = document.getElementById("searchInput").value.trim().toUpperCase();
      filteredStocks = stocks.filter(s => s.symbol && (!keyword || s.symbol.includes(keyword)));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("priceTable");
      tbody.innerHTML = "";
      filteredStocks.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selectedSymbol === s.symbol ? "selected" : "";
        tr.onclick = () => selectStock(s);
        const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
        tr.innerHTML = `
          <td class="font-bold">${s.symbol}</td>
          <td class="text-right ${cls}">${Number(s.price||0).toLocaleString()}</td>
          <td class="text-right ${cls}">${s.change>0?"+":""}${Number(s.change||0).toLocaleString()}</td>
          <td class="text-right ${cls}">${s.percent>0?"+":""}${Number(s.percent||0).toFixed(2)}</td>
          <td class="text-right text-slate-500">${(Number(s.volume||0)/1000).toFixed(0)}K</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function selectStock(stock) {
      selectedSymbol = stock.symbol;
      renderTable();
      document.getElementById("chartTitle").textContent = stock.symbol;

      // Panel thông tin
      const panel = document.getElementById("companyPanel");
      panel.innerHTML = `
        <div class="mb-3">
          <div class="text-xl font-bold text-blue-400">${stock.symbol}</div>
          <div class="text-sm text-slate-300 mt-1" id="companyName">Đang tải...</div>
        </div>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span class="info-label">Giá</span><span class="info-value ${stock.change>0?'up':stock.change<0?'down':'ref'}">${Number(stock.price).toLocaleString()}</span></div>
          <div class="flex justify-between"><span class="info-label">Thay đổi</span><span class="info-value ${stock.change>0?'up':stock.change<0?'down':'ref'}">${stock.change>0?'+':''}${Number(stock.change).toLocaleString()} (${Number(stock.percent).toFixed(2)}%)</span></div>
          <div class="flex justify-between"><span class="info-label">Khối lượng</span><span class="info-value">${Number(stock.volume).toLocaleString()}</span></div>
          <div class="flex justify-between"><span class="info-label">Trần / Sàn</span><span class="info-value">${Number(stock.ceiling).toLocaleString()} / ${Number(stock.floor).toLocaleString()}</span></div>
          <hr class="border-slate-700 my-2">
          <div class="flex justify-between"><span class="info-label">Sàn</span><span class="info-value" id="cExchange">—</span></div>
          <div class="flex justify-between"><span class="info-label">Ngành</span><span class="info-value" id="cIndustry">—</span></div>
          <div class="flex justify-between"><span class="info-label">Vốn hóa</span><span class="info-value" id="cMcap">—</span></div>
          <div class="flex justify-between"><span class="info-label">SLCP lưu hành</span><span class="info-value" id="cShares">—</span></div>
          <div class="flex justify-between"><span class="info-label">P/E</span><span class="info-value" id="cPE">—</span></div>
          <div class="flex justify-between"><span class="info-label">EPS</span><span class="info-value" id="cEPS">—</span></div>
        </div>
      `;
      try {
        const res = await fetch(`${API_BASE}/api/company/${stock.symbol}`);
        const info = await res.json();
        document.getElementById("companyName").textContent = info.full_name || info.name || stock.symbol;
        document.getElementById("cExchange").textContent = info.exchange || "—";
        document.getElementById("cIndustry").textContent = info.industry || "—";
      } catch {}

      // Lấy history ~3 năm
      try {
        const res = await fetch(`${API_BASE}/api/history/${stock.symbol}?days=800`);
        rawHistory = await res.json() || [];
      } catch { rawHistory = []; }

      currentTF = "D";
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === "D"));
      drawChart();
    }

    function changeTimeframe(tf) {
      currentTF = tf;
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf));
      drawChart();
    }

    function aggregate(data, tf) {
      if (tf === "D" || !data.length) return data;
      const map = {};
      data.forEach(d => {
        const date = new Date(d.time * 1000);
        let key;
        if (tf === "W") {
          const day = date.getDay();
          const diff = date.getDate() - day + (day === 0 ? -6 : 1);
          const monday = new Date(date.setDate(diff));
          key = monday.toISOString().slice(0, 10);
        } else {
          key = date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
        }
        if (!map[key]) {
          map[key] = { time: d.time, open: d.open, high: d.high, low: d.low, close: d.close, volume: d.volume || 0 };
        } else {
          map[key].high = Math.max(map[key].high, d.high);
          map[key].low = Math.min(map[key].low, d.low);
          map[key].close = d.close;
          map[key].volume += (d.volume || 0);
          map[key].time = d.time;
        }
      });
      return Object.values(map).sort((a, b) => a.time - b.time);
    }

    function drawChart() {
      const container = document.getElementById("chart");
      container.innerHTML = "";
      if (!rawHistory.length) return;

      const data = aggregate(rawHistory, currentTF);

      chart = LightweightCharts.createChart(container, {
        layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" },
        grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } },
        width: container.clientWidth,
        height: container.clientHeight,
        rightPriceScale: { borderVisible: false },
        timeScale: { borderVisible: false, timeVisible: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: "#22c55e", downColor: "#ef4444",
        borderUpColor: "#22c55e", borderDownColor: "#ef4444",
        wickUpColor: "#22c55e", wickDownColor: "#ef4444",
        priceScaleId: "right"
      });
      candleSeries.setData(data.map(d => ({ time: d.time, open: d.open, high: d.high, low: d.low, close: d.close })));

      volumeSeries = chart.addHistogramSeries({
        color: "#3b82f6",
        priceFormat: { type: "volume" },
        priceScaleId: "volume",
        scaleMargins: { top: 0.8, bottom: 0 }
      });
      volumeSeries.setData(data.map(d => ({
        time: d.time,
        value: d.volume || 0,
        color: d.close >= d.open ? "rgba(34,197,94,0.5)" : "rgba(239,68,68,0.5)"
      })));

      chart.priceScale("volume").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
      // Hiện khoảng 80 nến gần nhất, vẫn giữ full data để zoom out
      const total = data.length;
      if (total > 80) {
        chart.timeScale().setVisibleLogicalRange({
          from: total - 80,
          to: total - 1 + 5
        });
      } else {
        chart.timeScale().fitContent();
      }
      window.addEventListener("resize", () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    document.getElementById("searchInput").addEventListener("input", applyFilter);
    fetchBoard();
    setInterval(fetchBoard, 30000);
  </script>
</body>
</html>
