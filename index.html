<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background:#0f172a; color:#e2e8f0; margin:0; }
    .up { color:#22c55e; } .down { color:#ef4444; } .ref { color:#facc15; }
    tr:hover { background:#1e293b; cursor:pointer; } .selected { background:#1e3a5f !important; }
    #priceTable td, #priceTable th { padding:4px 6px; font-size:12px; white-space:nowrap; }
    #hotTable td, #hotTable th { padding:0 4px; white-space:nowrap; font-size:11px; line-height:1.05; }
    #hotTable .grp td { padding:1px 4px; }
    .info-label { color:#94a3b8; font-size:11px; }
    .tf-btn { padding:3px 10px; font-size:12px; border-radius:4px; background:#1e293b; border:1px solid #334155; cursor:pointer; }
    .tf-btn.active { background:#1e40af; }
    .sec-h { position:sticky; top:0; background:#111827; color:#93c5fd; font-size:11px; font-weight:700; letter-spacing:.02em; padding:6px 8px; border-bottom:1px solid #334155; }
    @media (min-width:768px) {
      body { overflow:hidden; height:100vh; }
      .main-layout { display:flex; height:calc(100vh - 40px); }
      .col-board { width:268px; min-width:220px; overflow:auto; border-right:1px solid #334155; }
      .col-hot { width:392px; min-width:320px; overflow:hidden; border-right:1px solid #334155; display:flex; flex-direction:column; }
      .col-hot .sec-h { position:static; flex:0 0 auto; padding:3px 6px; font-size:10px; }
      .col-hot table { flex:1 1 auto; height:100%; }
      .col-hot thead { position:static; }
      #hotTable th, #hotTable td { height:calc((100vh - 78px) / 53); font-size:clamp(8px, 1.05vh, 11px); }
      #hotTable .grp td { height:calc((100vh - 78px) / 70); font-size:9px; }
      .col-chart { flex:1; min-width:360px; display:flex; flex-direction:column; }
    }
    .tabbar { display:none; }
    @media (max-width:767px) {
      body { height:100dvh; overflow:hidden; }
      .topbar { padding-top:max(8px, env(safe-area-inset-top)); }
      .topbar h1 { font-size:15px; }
      #searchInput { width:92px; min-height:36px; font-size:16px; }
      #status { display:none; }
      .main-layout { display:block; height:calc(100dvh - 52px - 58px - env(safe-area-inset-bottom)); }
      .col-board, .col-hot, .col-chart { display:none; height:100%; overflow:auto; }
      .col-board.show, .col-hot.show, .col-chart.show { display:flex; flex-direction:column; }
      .col-board.show { display:block; }
      .sec-h { position:sticky; top:0; z-index:2; font-size:12px; padding:8px 10px; }
      #priceTable td, #priceTable th, #hotTable td, #hotTable th { font-size:14px; padding:10px 8px; line-height:1.25; height:auto; }
      #hotTable .grp td { font-size:12px; padding:6px 8px; height:auto; }
      .col-hot table, .col-hot thead { height:auto; position:static; }
      .col-chart { min-width:0; }
      #companyPanel { font-size:13px; }
      #companyPanel .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
      #chart { min-height:0; flex:1; }
      .tf-btn { min-height:36px; padding:6px 12px; font-size:14px; }
      .tabbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; background:#0b1220; border-top:1px solid #334155; padding-bottom:env(safe-area-inset-bottom); }
      .tabbar button { flex:1; min-height:52px; background:transparent; color:#94a3b8; border:0; font-size:13px; font-weight:600; }
      .tabbar button.active { color:#93c5fd; }
    }
  </style>
</head>
<body class="flex flex-col">
  <div class="topbar px-3 py-2 border-b border-slate-700 flex items-center gap-2">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" placeholder="Tìm mã..." class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto">Đang tải...</p>
  </div>
  <div class="main-layout">
    <div class="col-board">
      <div class="sec-h">Danh sách lọc</div>
      <table class="w-full">
        <thead class="bg-slate-800 sticky top-[29px] text-xs">
          <tr><th class="text-left">Mã</th><th class="text-right">Giá</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>
    <div class="col-hot">
      <div class="sec-h" id="hotTitle">Bảng giá · 35 HSX + 15 HNX tăng mạnh</div>
      <table class="w-full">
        <thead class="bg-slate-800 sticky top-[29px] text-xs">
          <tr><th class="text-left">Mã</th><th class="text-left">Sàn</th><th class="text-right">Giá</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr>
        </thead>
        <tbody id="hotTable"></tbody>
      </table>
    </div>
    <div class="col-chart">
      <div class="px-3 py-1.5 border-b border-slate-700 flex gap-2 items-center">
        <span id="chartTitle" class="text-xs text-slate-400">Chart</span>
        <button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button>
        <button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button>
        <button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button>
      </div>
      <div id="companyPanel" class="px-3 py-2 border-b border-slate-700 text-xs"><span class="text-slate-500">Chọn mã để xem thông tin</span></div>
      <div id="chart" class="flex-1" style="min-height:240px"></div>
    </div>
  </div>
  <nav class="tabbar" aria-label="Chuyển khung">
    <button type="button" class="active" data-tab="board" onclick="showTab('board')">Lọc</button>
    <button type="button" data-tab="hot" onclick="showTab('hot')">Nóng</button>
    <button type="button" data-tab="chart" onclick="showTab('chart')">Chart</button>
  </nav>
  <script>
    const VPS = "https://bgapidatafeed.vps.com.vn/getliststockdata";
    const VPS_LIST = "https://bgapidatafeed.vps.com.vn/getlistallstock";
    const CAFEF = "https://cafef.vn/du-lieu/ajax/pagenew/datahistory/pricehistory.ashx";
    const API = "https://skystock-api-1.onrender.com";
    const PROFILE = "https://api.simplize.vn/api/company/summary";
    let hotMode = "prev";
    let symbols = [], stocks = [], filtered = [], selected = null, profiles = {};
    let universe = [], hot = [], hotDate = "", chart = null, candleSeries = null, volumeSeries = null, rawHistory = [], currentTF = "D";

    function toVnd(v) { const n = Number(v); if (!n) return 0; return n < 1000 ? Math.round(n * 1000) : Math.round(n); }
    function num(v, d = 0) { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString("vi-VN", { maximumFractionDigits: d }) : "—"; }
    function ty(v) { const n = Number(v); if (!n) return "—"; return (n / 1e9).toLocaleString("vi-VN", { maximumFractionDigits: 0 }) + " tỷ"; }
    function mapVps(row, floor) {
      const last = Number(row.lastPrice || 0), ref = Number(row.r || 0);
      const traded = last > 0 && ref > 0;
      const px = traded ? last : Number(row.closePrice || 0);
      return {
        symbol: row.sym,
        floor: floor || row.mc || "",
        price: toVnd(px),
        change: traded ? (last - ref) * 1000 : 0,
        percent: traded ? (last - ref) / ref * 100 : 0,
        volume: Number(row.lot || 0) * 10,
        ceiling: toVnd(row.c),
        floorPrice: toVnd(row.f)
      };
    }
    async function fetchQuotes(list) {
      const rows = [];
      for (let i = 0; i < list.length; i += 60) {
        const res = await fetch(`${VPS}/${list.slice(i, i + 60).join(",")}`);
        if (res.ok) rows.push(...await res.json());
      }
      return rows;
    }
    async function loadList() {
      const res = await fetch("https://raw.githubusercontent.com/skynel2417/skystock/main/scan.json?ts=" + Date.now());
      const data = await res.json();
      symbols = (data.symbols || []).map(s => String(s).toUpperCase());
    }
    async function loadUniverse() {
      const res = await fetch(VPS_LIST);
      const data = await res.json();
      universe = data.filter(x => x.type === "S" && /^[A-Z]{3}$/.test(x.stock_code) && (x.post_to === "HOSE" || x.post_to === "HNX"))
        .map(x => ({ symbol: x.stock_code, floor: x.post_to === "HOSE" ? "HSX" : "HNX" }));
    }
    async function fetchBoard() {
      if (!symbols.length) { stocks = []; applyFilter(); }
      else {
        const rows = await fetchQuotes(symbols);
        const got = new Map(rows.map(r => [r.sym, mapVps(r)]));
        stocks = symbols.map(s => got.get(s) || { symbol: s, price: 0, change: 0, percent: 0, volume: 0 });
        applyFilter();
      }
      document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • lọc ${filtered.length} • nóng ${hot.length}`;
    }
    function vnNow() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" })); }
    function afterOpen() {
      const d = vnNow();
      const day = d.getDay();
      if (day === 0 || day === 6) return false;
      return d.getHours() * 60 + d.getMinutes() >= 9 * 60;
    }
    function parsePrev(text) {
      const m = String(text || "").match(/([+-]?[\d.,]+)\s*\(([+-]?[\d.,]+)%\)/);
      if (!m) return { change: 0, percent: 0 };
      const num = v => Number(String(v).replace(/\./g, "").replace(",", "."));
      return { change: num(m[1]) * 1000, percent: num(m[2]) };
    }
    function rankHot(list) {
      const top = (floor, n) => list.filter(s => s.floor === floor && s.percent > 0 && Number(s.volume) > 10000).sort((a, b) => b.percent - a.percent || b.change - a.change).slice(0, n);
      return [...top("HSX", 35), ...top("HNX", 15)];
    }
    async function fetchPrevHot() {
      const res = await fetch("prev.json?ts=" + Date.now());
      if (!res.ok) throw new Error("prev");
      const saved = await res.json();
      hot = rankHot(saved.rows || []);
      hotMode = "prev";
      hotDate = saved.date || "";
      renderHot();
      document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • lọc ${filtered.length} • nóng ${hot.length}`;
    }
    async function fetchHot() {
      if (!universe.length) await loadUniverse();
      if (!afterOpen()) { await fetchPrevHot(); return; }
      const floorOf = new Map(universe.map(x => [x.symbol, x.floor]));
      const rows = await fetchQuotes(universe.map(x => x.symbol));
      const mapped = rows.map(r => mapVps(r, floorOf.get(r.sym)));
      const live = rankHot(mapped);
      if (!live.length) { await fetchPrevHot(); return; }
      hot = live;
      hotMode = "live";
      hotDate = "";
      renderHot();
      document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • lọc ${filtered.length} • nóng ${hot.length}`;
    }
    function applyFilter() {
      const q = document.getElementById("searchInput").value.trim().toUpperCase();
      filtered = stocks.filter(s => !q || s.symbol.includes(q));
      renderTable();
    }
    function cells(s, withFloor) {
      const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
      return `<td class="font-bold">${s.symbol}</td>${withFloor ? `<td class="text-slate-400">${s.floor || ""}</td>` : ""}<td class="text-right ${cls}">${Number(s.price || 0).toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.change > 0 ? "+" : ""}${Number(s.change || 0).toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.percent > 0 ? "+" : ""}${Number(s.percent || 0).toFixed(2)}</td><td class="text-right text-slate-500">${(Number(s.volume || 0) / 1000).toFixed(0)}K</td>`;
    }
    function renderTable() {
      const tb = document.getElementById("priceTable");
      tb.innerHTML = filtered.length ? "" : `<tr><td colspan="5" class="text-slate-500 text-center py-4">Chưa có mã</td></tr>`;
      filtered.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selected === s.symbol ? "selected" : "";
        tr.onclick = () => selectStock(s);
        tr.innerHTML = cells(s, false);
        tb.appendChild(tr);
      });
    }
    function renderHot() {
      const tb = document.getElementById("hotTable");
      tb.innerHTML = "";
      document.getElementById("hotTitle").textContent = hotMode === "live" ? "Realtime · 35 HSX + 15 HNX tăng mạnh" : `Phiên trước${hotDate ? " " + hotDate : ""} · 35 HSX + 15 HNX tăng mạnh`;
      if (!hot.length) { tb.innerHTML = `<tr><td colspan="6" class="text-slate-500 text-center py-4">${hotMode === "live" ? "Chưa có mã tăng" : "Đang tải phiên trước..."}</td></tr>`; return; }
      let last = "";
      hot.forEach(s => {
        if (s.floor !== last) {
          last = s.floor;
          const hr = document.createElement("tr");
          hr.className = "grp";
          hr.innerHTML = `<td colspan="6" class="bg-slate-800 text-blue-300 font-semibold">${s.floor === "HSX" ? "HSX · tăng mạnh" : "HNX · tăng mạnh"}</td>`;
          tb.appendChild(hr);
        }
        const tr = document.createElement("tr");
        tr.className = selected === s.symbol ? "selected" : "";
        tr.onclick = () => selectStock(s);
        tr.innerHTML = cells(s, true);
        tb.appendChild(tr);
      });
    }
    function showTab(name) {
      document.querySelector(".col-board").classList.toggle("show", name === "board");
      document.querySelector(".col-hot").classList.toggle("show", name === "hot");
      document.querySelector(".col-chart").classList.toggle("show", name === "chart");
      document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
      if (name === "chart" && chart) requestAnimationFrame(() => chart.timeScale().fitContent());
    }
    function ensureChart() {
      if (chart) return;
      const el = document.getElementById("chart");
      chart = LightweightCharts.createChart(el, { layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" }, grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } }, autoSize: true });
      candleSeries = chart.addCandlestickSeries({ upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444" });
      volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    }
    function normalizeBar(bar) {
      const time = Number(bar.time || bar.t);
      return { time: time > 1e12 ? Math.floor(time / 1000) : time, open: toVnd(bar.open ?? bar.o), high: toVnd(bar.high ?? bar.h), low: toVnd(bar.low ?? bar.l), close: toVnd(bar.close ?? bar.c), volume: Number(bar.volume ?? bar.v ?? 0) };
    }
    function bucketKey(time, tf) {
      const d = new Date(time * 1000);
      if (tf === "M") return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000;
      if (tf === "W") { const day = d.getUTCDay() || 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 1) / 1000; }
      return time;
    }
    function aggregate(bars, tf) {
      if (tf === "D") return bars;
      const map = new Map();
      bars.forEach(b => {
        const key = bucketKey(b.time, tf);
        const cur = map.get(key);
        if (!cur) map.set(key, { ...b, time: key });
        else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; }
      });
      return [...map.values()];
    }
    function drawChart() {
      ensureChart();
      const bars = aggregate(rawHistory, currentTF).filter(b => b.time && b.open);
      candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
      volumeSeries.setData(bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? "rgba(34,197,94,0.45)" : "rgba(239,68,68,0.45)" })));
      chart.timeScale().fitContent();
    }
    function changeTimeframe(tf) {
      currentTF = tf;
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf));
      if (rawHistory.length) drawChart();
    }
    function row(label, value) { return `<div class="flex justify-between gap-3"><span class="info-label">${label}</span><span class="text-right">${value}</span></div>`; }
    function renderProfile(stock, profile) {
      const cls = stock.change > 0 ? "up" : stock.change < 0 ? "down" : "ref";
      const p = profile || {};
      document.getElementById("companyPanel").innerHTML = `<div class="flex items-baseline gap-2"><span class="text-sm font-bold text-blue-400">${stock.symbol}</span><span class="${cls}">${num(stock.price)} (${stock.change > 0 ? "+" : ""}${num(stock.percent, 2)}%)</span><span class="text-slate-300 truncate">${p.name || "Đang tải tên doanh nghiệp..."}</span></div><div class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-1 mt-1">${row("Ngành", p.industry || p.sector || "—")}${row("EPS", num(p.eps, 0))}${row("P/E", num(p.pe, 2))}${row("Vốn hóa", ty(p.mcap))}</div>`;
    }
    async function loadProfile(symbol) {
      if (profiles[symbol]) return profiles[symbol];
      const res = await fetch(`${PROFILE}/${symbol}`);
      if (!res.ok) return null;
      const data = (await res.json()).data || {};
      profiles[symbol] = { name: data.nameVi || data.name || symbol, sector: data.bcEconomicSectorName || "", industry: data.industryActivity || "", eps: data.epsRatio, pe: data.peRatio, mcap: data.marketCap, shares: data.outstandingSharesValue };
      return profiles[symbol];
    }
    async function selectStock(stock) {
      selected = stock.symbol;
      if (window.matchMedia("(max-width:767px)").matches) showTab("chart");
      renderTable();
      renderHot();
      document.getElementById("chartTitle").textContent = stock.symbol;
      renderProfile(stock, profiles[stock.symbol]);
      const profileTask = loadProfile(stock.symbol).then(p => { if (selected === stock.symbol) renderProfile(stock, p); }).catch(() => {});
      try {
        const res = await fetch(`${API}/api/history/${stock.symbol}?days=160`);
        const data = await res.json();
        rawHistory = Array.isArray(data) ? data.map(normalizeBar) : [];
      } catch { rawHistory = []; }
      currentTF = "D";
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === "D"));
      if (rawHistory.length) drawChart();
      await profileTask;
    }
    document.getElementById("searchInput").addEventListener("input", applyFilter);
    if (window.matchMedia("(max-width:767px)").matches) showTab("hot");
    window.addEventListener("resize", () => { if (chart) chart.timeScale().fitContent(); });
    (async () => {
      try {
        await loadList();
        await fetchBoard();
        fetchHot().catch(() => {});
        setInterval(async () => { await loadList(); await fetchBoard(); }, 15000);
        setInterval(() => { fetchHot().catch(() => {}); }, 20000);
      } catch { document.getElementById("status").textContent = "Lỗi tải dữ liệu"; }
    })();
  </script>
</body>
</html>
