<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; }
    .up { color: #22c55e; } .down { color: #ef4444; } .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; } .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 4px 6px; font-size: 12px; white-space: nowrap; }
    .info-label { color: #94a3b8; font-size: 11px; } .info-value { font-size: 12px; font-weight: 500; }
    .tf-btn { padding: 3px 10px; font-size: 12px; border-radius: 4px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .tf-btn.active { background: #1e40af; border-color: #3b82f6; }
    @media (min-width: 768px) { body { overflow: hidden; height: 100vh; } .main-layout { display: flex; height: calc(100vh - 40px); } .col-board { width: 340px; overflow: auto; border-right: 1px solid #334155; } .col-info { width: 280px; overflow: auto; border-right: 1px solid #334155; } .col-chart { flex: 1; display: flex; flex-direction: column; } }
    @media (max-width: 767px) { .main-layout { display: block; } .col-board { max-height: 45vh; overflow: auto; } .col-info { padding: 12px; } .col-chart { height: 55vh; display: flex; flex-direction: column; } }
  </style>
</head>
<body class="flex flex-col">
  <div class="px-3 py-2 border-b border-slate-700 flex items-center gap-2">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" placeholder="Tìm mã..." class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto">Đang tải...</p>
  </div>
  <div class="main-layout">
    <div class="col-board"><table class="w-full"><thead class="bg-slate-800 sticky top-0 text-xs"><tr><th class="text-left">Mã</th><th class="text-right">Giá</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr></thead><tbody id="priceTable"></tbody></table></div>
    <div class="col-info p-3"><div id="companyPanel"><p class="text-slate-500 text-sm text-center mt-6">Chọn mã để xem thông tin</p></div></div>
    <div class="col-chart"><div class="px-3 py-1.5 border-b border-slate-700 flex gap-2"><span id="chartTitle" class="text-xs text-slate-400">Chart</span><button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button><button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button><button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button></div><div id="chart" class="flex-1" style="min-height:280px"></div></div>
  </div>
  <script>
    const VPS = "https://bgapidatafeed.vps.com.vn/getliststockdata";
    const API = "https://skystock-api-1.onrender.com";
    const TV = "https://scanner.tradingview.com/vietnam/scan";
    const RULES = { rsiPeriod: 14, bbPeriod: 10, bbMult: 0.9, maPeriod: 8, minValue: 2e9, minMcap: 500e9 };
    let watch = [], stocks = [], filtered = [], selected = null, histories = {};
    let chart = null, candleSeries = null, volumeSeries = null, rawHistory = [], currentTF = "D", scanning = false;
    function toVnd(v) { const n = Number(v); if (!n) return 0; return n < 1000 ? Math.round(n * 1000) : Math.round(n); }
    function sma(a, n) { if (a.length < n) return null; let s = 0; for (let i = a.length - n; i < a.length; i++) s += a[i]; return s / n; }
    function rsiSeries(c, p) { const out = Array(c.length).fill(null); if (c.length <= p) return out; let g = 0, l = 0; for (let i = 1; i <= p; i++) { const ch = c[i] - c[i - 1]; if (ch >= 0) g += ch; else l -= ch; } let ag = g / p, al = l / p; out[p] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); for (let i = p + 1; i < c.length; i++) { const ch = c[i] - c[i - 1]; ag = (ag * (p - 1) + (ch > 0 ? ch : 0)) / p; al = (al * (p - 1) + (ch < 0 ? -ch : 0)) / p; out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); } return out; }
    function bbAt(series, i, period, mult) { if (i < period - 1 || series[i] == null) return null; const win = series.slice(i - period + 1, i + 1); if (win.some(x => x == null)) return null; const mid = win.reduce((a, b) => a + b, 0) / period; return mid + mult * Math.sqrt(win.reduce((a, b) => a + (b - mid) ** 2, 0) / period); }
    function evaluate(stock) {
      const bars = histories[stock.symbol];
      if (!bars || bars.length < 30 || stock.mcap < RULES.minMcap) return false;
      const closes = bars.map(b => b.close); closes[closes.length - 1] = stock.price || closes.at(-1);
      const vols = bars.map(b => b.volume); vols[vols.length - 1] = stock.volume || vols.at(-1);
      const ma = sma(closes, 8), prev = sma(closes.slice(0, -1), 8);
      const rsi = rsiSeries(closes, 14), i = closes.length - 1;
      const up = bbAt(rsi, i, 10, 0.9), upPrev = bbAt(rsi, i - 1, 10, 0.9);
      const cross = up != null && upPrev != null && rsi[i - 1] <= upPrev && rsi[i] > up;
      const avg = closes.slice(-5).reduce((s, c, k) => s + c * vols[vols.length - 5 + k], 0) / 5;
      return stock.price > ma && ma > prev && cross && avg > RULES.minValue;
    }
    async function screen() {
      const body = { filter: [{ left: "exchange", operation: "in_range", right: ["HOSE", "HNX"] }, { left: "market_cap_basic", operation: "greater", right: RULES.minMcap }], columns: ["name", "exchange", "close", "SMA8", "market_cap_basic", "average_volume_10d_calc"], sort: { sortBy: "market_cap_basic", sortOrder: "desc" }, range: [0, 500] };
      const res = await fetch(TV, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      watch = (data.data || []).map(row => { const [name, ex, close, sma, mcap, avol] = row.d; return { symbol: name, ex: ex === "HNX" ? "HNX" : "HSX", close, sma, mcap, liq: (close || 0) * (avol || 0) }; }).filter(x => x.close > x.sma && x.liq > RULES.minValue);
    }
    function mapVps(row, meta) { const last = Number(row.lastPrice || 0), ref = Number(row.r || 0); return { symbol: row.sym, ex: meta.ex, mcap: meta.mcap, price: toVnd(last || row.closePrice), change: (last - ref) * 1000, percent: ref ? (last - ref) / ref * 100 : 0, volume: Number(row.lot || 0) * 10, ceiling: toVnd(row.c), floor: toVnd(row.f) }; }
    async function fetchBoard() {
      if (!watch.length) return;
      const meta = Object.fromEntries(watch.map(x => [x.symbol, x]));
      const symbols = watch.map(x => x.symbol);
      const rows = [];
      for (let i = 0; i < symbols.length; i += 60) { try { const res = await fetch(`${VPS}/${symbols.slice(i, i + 60).join(",")}`); if (res.ok) rows.push(...await res.json()); } catch {} }
      stocks = rows.filter(r => meta[r.sym]).map(r => mapVps(r, meta[r.sym]));
      const allowed = new Set(symbols);
      for (const k of Object.keys(histories)) if (!allowed.has(k)) delete histories[k];
      stocks.forEach(s => { s.pass = evaluate(s); });
      applyFilter();
      document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filtered.length} mã`;
    }
    function applyFilter() { const q = document.getElementById("searchInput").value.trim().toUpperCase(); filtered = stocks.filter(s => (!q || s.symbol.includes(q)) && s.pass); renderTable(); }
    function renderTable() { const tb = document.getElementById("priceTable"); tb.innerHTML = filtered.length ? "" : `<tr><td colspan="5" class="text-slate-500 text-center py-4">Chưa có mã</td></tr>`; filtered.forEach(s => { const tr = document.createElement("tr"); tr.className = selected === s.symbol ? "selected" : ""; tr.onclick = () => selectStock(s); const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref"; tr.innerHTML = `<td class="font-bold">${s.symbol}</td><td class="text-right ${cls}">${s.price.toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.change > 0 ? "+" : ""}${s.change.toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.percent > 0 ? "+" : ""}${s.percent.toFixed(2)}</td><td class="text-right text-slate-500">${(s.volume / 1000).toFixed(0)}K</td>`; tb.appendChild(tr); }); }
    function ensureChart() { if (chart) return; const el = document.getElementById("chart"); chart = LightweightCharts.createChart(el, { layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" }, grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } }, autoSize: true }); candleSeries = chart.addCandlestickSeries({ upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444" }); volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" }); chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } }); }
    function normalizeBar(bar) { const time = Number(bar.time || bar.t); return { time: time > 1e12 ? Math.floor(time / 1000) : time, open: toVnd(bar.open ?? bar.o), high: toVnd(bar.high ?? bar.h), low: toVnd(bar.low ?? bar.l), close: toVnd(bar.close ?? bar.c), volume: Number(bar.volume ?? bar.v ?? 0) }; }
    async function loadHistory(symbol) { try { const res = await fetch(`${API}/api/history/${symbol}?days=160`); if (!res.ok) return []; const data = await res.json(); return Array.isArray(data) ? data.map(normalizeBar).slice(-120) : []; } catch { return []; } }
    function loadCache() { try { const saved = JSON.parse(localStorage.getItem("ss_h4") || "null"); if (saved && Date.now() - saved.at < 6 * 3600 * 1000) histories = saved.data || {}; } catch {} }
    function saveCache() { try { const data = {}; for (const s of watch) if (histories[s.symbol] && histories[s.symbol].length) data[s.symbol] = histories[s.symbol].slice(-120); localStorage.setItem("ss_h4", JSON.stringify({ at: Date.now(), data })); } catch {} }
    async function pool(items, limit, fn) { let i = 0; await Promise.all(Array.from({ length: limit }, async () => { while (i < items.length) await fn(items[i++]); })); }
    async function warm() { if (scanning) return; scanning = true; loadCache(); const need = watch.map(s => s.symbol).filter(s => !histories[s] || !histories[s].length); await pool(need, 8, async symbol => { const bars = await loadHistory(symbol); if (bars.length) histories[symbol] = bars; stocks.forEach(s => { s.pass = evaluate(s); }); applyFilter(); document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filtered.length} mã`; }); saveCache(); scanning = false; }
    function bucketKey(time, tf) { const d = new Date(time * 1000); if (tf === "M") return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000; if (tf === "W") { const day = d.getUTCDay() || 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 1) / 1000; } return time; }
    function aggregate(bars, tf) { if (tf === "D") return bars; const map = new Map(); bars.forEach(b => { const key = bucketKey(b.time, tf); const cur = map.get(key); if (!cur) map.set(key, { ...b, time: key }); else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; } }); return [...map.values()]; }
    function drawChart() { ensureChart(); const bars = aggregate(rawHistory, currentTF).filter(b => b.time && b.open); candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close }))); volumeSeries.setData(bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? "rgba(34,197,94,0.45)" : "rgba(239,68,68,0.45)" }))); chart.timeScale().fitContent(); }
    function changeTimeframe(tf) { currentTF = tf; document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf)); if (rawHistory.length) drawChart(); }
    async function selectStock(stock) { selected = stock.symbol; renderTable(); document.getElementById("chartTitle").textContent = stock.symbol; const cls = stock.change > 0 ? "up" : stock.change < 0 ? "down" : "ref"; document.getElementById("companyPanel").innerHTML = `<div class="text-lg font-bold text-blue-400">${stock.symbol}</div><div class="text-sm text-slate-400 mb-2">${stock.ex}</div><div class="space-y-1.5 text-sm"><div class="flex justify-between"><span class="info-label">Giá</span><span class="${cls}">${stock.price.toLocaleString("vi-VN")}</span></div><div class="flex justify-between"><span class="info-label">Thay đổi</span><span class="${cls}">${stock.change > 0 ? "+" : ""}${stock.change.toLocaleString("vi-VN")} (${stock.percent.toFixed(2)}%)</span></div><div class="flex justify-between"><span class="info-label">Khối lượng</span><span>${stock.volume.toLocaleString("vi-VN")}</span></div></div>`; rawHistory = histories[stock.symbol] && histories[stock.symbol].length ? histories[stock.symbol] : await loadHistory(stock.symbol); histories[stock.symbol] = rawHistory; currentTF = "D"; if (rawHistory.length) drawChart(); }
    document.getElementById("searchInput").addEventListener("input", applyFilter);
    (async () => { try { await screen(); await fetchBoard(); warm(); setInterval(fetchBoard, 20000); } catch { document.getElementById("status").textContent = "Đang tải..."; } })();
  </script>
</body>
</html>
