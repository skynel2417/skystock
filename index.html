<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; overflow: hidden; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 4px 8px; font-size: 12px; }
    #chart { height: 100%; }
  </style>
</head>
<body class="h-screen flex flex-col">
  <!-- Header -->
  <div class="px-4 py-2 border-b border-slate-700 flex items-center justify-between gap-4 flex-shrink-0">
    <h1 class="text-lg font-bold whitespace-nowrap">Bảng giá CK Việt Nam</h1>
    <input id="searchInput" type="text" placeholder="Tìm mã..." 
           class="bg-slate-800 border border-slate-600 rounded px-3 py-1 text-sm w-32 focus:outline-none focus:border-blue-500" />
    <p id="status" class="text-xs text-slate-400 truncate">Đang tải...</p>
  </div>

  <!-- Main content: bảng giá + chart nằm ngang -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Bảng giá bên trái -->
    <div class="w-1/2 overflow-auto border-r border-slate-700">
      <table class="w-full text-left">
        <thead class="bg-slate-800 text-slate-300 sticky top-0">
          <tr>
            <th class="py-2 px-2">Mã</th>
            <th class="py-2 px-2 text-right">Giá</th>
            <th class="py-2 px-2 text-right">±</th>
            <th class="py-2 px-2 text-right">%</th>
            <th class="py-2 px-2 text-right">KL</th>
          </tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>

    <!-- Chart bên phải -->
    <div class="w-1/2 flex flex-col">
      <div class="px-3 py-2 border-b border-slate-700 text-sm font-medium" id="chartTitle">
        Chọn mã để xem chart
      </div>
      <div id="chart" class="flex-1"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://skystock-api-1.onrender.com";
    const SYMBOLS = "ACB,BCM,BID,BVH,CTG,FPT,GAS,GVR,HDB,HPG,MBB,MSN,MWG,PLX,SAB,SHB,SSB,SSI,STB,TCB,TPB,VCB,VHM,VIB,VIC,VJC,VNM,VPB,VRE,DGC,PNJ,REE,KDH,DXG";

    let stocks = [];
    let filteredStocks = [];
    let selectedSymbol = null;
    let chart = null;
    let candleSeries = null;

    async function fetchBoard() {
      const statusEl = document.getElementById("status");
      try {
        statusEl.textContent = "Đang tải...";
        const res = await fetch(`${API_BASE}/api/board?symbols=${SYMBOLS}`);
        if (!res.ok) throw new Error("API lỗi");
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          stocks = data;
          applyFilter();
          statusEl.textContent = `Cập nhật ${new Date().toLocaleTimeString("vi-VN")} • ${filteredStocks.length} mã`;
        } else {
          statusEl.textContent = "API rỗng";
        }
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Backend đang ngủ / lỗi kết nối";
      }
    }

    function applyFilter() {
      const keyword = document.getElementById("searchInput").value.trim().toUpperCase();
      filteredStocks = stocks.filter(s => {
        if (!s.symbol) return false;
        // Sau này bạn muốn lọc chỉ mã tăng thì thêm điều kiện ở đây
        // Ví dụ: if (s.change <= 0) return false;
        if (keyword && !s.symbol.includes(keyword)) return false;
        return true;
      });
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("priceTable");
      tbody.innerHTML = "";
      filteredStocks.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selectedSymbol === s.symbol ? "selected" : "";
        tr.onclick = () => showChart(s.symbol);
        const changeClass = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
        tr.innerHTML = `
          <td class="font-bold">${s.symbol}</td>
          <td class="text-right ${changeClass}">${Number(s.price||0).toLocaleString()}</td>
          <td class="text-right ${changeClass}">${s.change>0?"+":""}${Number(s.change||0).toLocaleString()}</td>
          <td class="text-right ${changeClass}">${s.percent>0?"+":""}${Number(s.percent||0).toFixed(2)}%</td>
          <td class="text-right text-slate-400">${Number(s.volume||0).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function showChart(symbol) {
      selectedSymbol = symbol;
      document.getElementById("chartTitle").textContent = `Chart: ${symbol}`;
      renderTable();

      const container = document.getElementById("chart");
      container.innerHTML = "";

      chart = LightweightCharts.createChart(container, {
        layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" },
        grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } },
        width: container.clientWidth,
        height: container.clientHeight,
        timeScale: { timeVisible: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: "#22c55e", downColor: "#ef4444",
        borderUpColor: "#22c55e", borderDownColor: "#ef4444",
        wickUpColor: "#22c55e", wickDownColor: "#ef4444"
      });

      try {
        const res = await fetch(`${API_BASE}/api/history/${symbol}?days=60`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          candleSeries.setData(data);
        }
      } catch (e) {
        console.error(e);
      }
      chart.timeScale().fitContent();

      // Resize khi cửa sổ thay đổi
      window.addEventListener("resize", () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    // Tìm kiếm realtime
    document.getElementById("searchInput").addEventListener("input", applyFilter);

    // Khởi chạy
    fetchBoard();
    setInterval(fetchBoard, 30000);
  </script>
</body>
</html>
