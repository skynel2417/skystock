<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 4px 6px; font-size: 12px; white-space: nowrap; }
    .info-label { color: #94a3b8; font-size: 11px; }
    .info-value { color: #e2e8f0; font-size: 12px; font-weight: 500; }
    .tf-btn { padding: 3px 10px; font-size: 12px; border-radius: 4px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .tf-btn.active { background: #1e40af; border-color: #3b82f6; }

    /* Desktop: 3 cột, full height */
    @media (min-width: 768px) {
      body { overflow: hidden; height: 100vh; }
      .main-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 40px); }
      .col-board { width: 260px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; }
      .col-info { width: 280px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; background: rgba(15,23,42,0.4); }
      .col-chart { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .mobile-only { display: none; }
    }

    /* Mobile: xếp dọc, có thể cuộn */
    @media (max-width: 767px) {
      body { overflow: auto; min-height: 100vh; }
      .main-layout { display: block; }
      .col-board { width: 100%; max-height: 45vh; overflow: auto; border-bottom: 1px solid #334155; }
      .col-info { width: 100%; padding: 12px; border-bottom: 1px solid #334155; }
      .col-chart { width: 100%; height: 55vh; display: flex; flex-direction: column; }
      .desktop-only { display: none; }
    }
  </style>
</head>
<body class="flex flex-col">
  <!-- Header -->
  <div class="px-3 py-2 border-b border-slate-700 flex items-center gap-2 flex-shrink-0">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" type="text" placeholder="Tìm mã..." 
           class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto truncate"></p>
  </div>

  <div class="main-layout">
    <!-- Bảng giá -->
    <div class="col-board">
      <table class="w-full">
        <thead class="bg-slate-800 text-slate-300 sticky top-0 text-xs">
          <tr>
            <th class="text-left">Mã</th>
            <th class="text-right">Giá</th>
            <th class="text-right">±</th>
            <th class="text-right">%</th>
            <th class="text-right">KL</th>
          </tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>

    <!-- Thông tin DN -->
    <div class="col-info p-3">
      <div id="companyPanel">
        <p class="text-slate-500 text-sm text-center mt-6">Chọn mã để xem thông tin</p>
      </div>
    </div>

    <!-- Chart -->
    <div class="col-chart">
      <div class="px-3 py-1.5 border-b border-slate-700 flex items-center gap-2 flex-shrink-0">
        <span id="chartTitle" class="text-xs text-slate-400 mr-1">Chart</span>
        <button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button>
        <button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button>
        <button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button>
      </div>
      <div id="chart" class="flex-1 w-full" style="min-height: 280px;"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://skystock-api-1.onrender.com";
    const SYMBOLS = "ACB,BCM,BID,BVH,CTG,FPT,GAS,GVR,HDB,HPG,MBB,MSN,MWG,PLX,SAB,SHB,SSB,SSI,STB,TCB,TPB,VCB,VHM,VIB,VIC,VJC,VNM,VPB,VRE,DGC,PNJ,REE,KDH,DXG";

    let stocks = [], filteredStocks = [], selectedSymbol = null;
    let chart = null, candleSeries = null, volumeSeries = null;
    let rawHistory = [], currentTF = "D";

    async function fetchBoard() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(`${API_BASE}/api/board?symbols=${SYMBOLS}`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          stocks = data;
          applyFilter();
          statusEl.textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filteredStocks.length} mã`;
        }
      } catch { statusEl.textContent = "Lỗi backend"; }
    }

    function applyFilter() {
      const keyword = document.getElementById("searchInput").value.trim().toUpperCase();
      filteredStocks = stocks.filter(s => s.symbol && (!keyword || s.symbol.includes(keyword)));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("priceTable");
      tbody.innerHTML = "";
      filteredStocks.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selectedSymbol === s.symbol ? "selected" : "";
        tr.onclick = () => selectStock(s);
        const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
        tr.innerHTML = `
          <td class="font-bold">${s.symbol}</td>
          <td class="text-right ${cls}">${Number(s.price||0).toLocaleString()}</td>
          <td class="text-right ${cls}">${s.change>0?"+":""}${Number(s.change||0).toLocaleString()}</td>
          <td class="text-right ${cls}">${s.percent>0?"+":""}${Number(s.percent||0).toFixed(2)}</td>
          <td class="text-right text-slate-500">${(Number(s.volume||0)/1000).toFixed(0)}K</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function selectStock(stock) {
      selectedSymbol = stock.symbol;
      renderTable();
      document.getElementById("chartTitle").textContent = stock.symbol;

      const panel = document.getElementById("companyPanel");
      panel.innerHTML = `
        <div class="mb-2">
          <div class="text-lg font-bold text-blue-400">${stock.symbol}</div>
          <div class="text-sm text-slate-300 mt-0.5" id="companyName">Đang tải...</div>
        </div>
        <div class="space-y-1.5 text-sm">
          <div class="flex justify-between"><span class="info-label">Giá</span><span class="info-value ${stock.change>0?'up':stock.change<0?'down':'ref'}">${Number(stock.price).toLocaleString()}</span></div>
          <div class="flex justify-between"><span class="info-label">Thay đổi</span><span class="info-value ${stock.change>0?'up':stock.change<0?'down':'ref'}">${stock.change>0?'+':''}${Number(stock.change).toLocaleString()} (${Number(stock.percent).toFixed(2)}%)</span></div>
          <div class="flex justify-between"><span class="info-label">Khối lượng</span><span class="info-value">${Number(stock.volume).toLocaleString()}</span></div>
          <div class="flex justify-between"><span class="info-label">Trần / Sàn</span><span class="info-value">${Number(stock.ceiling).toLocaleString()} / ${Number(stock.floor).toLocaleString()}</span></div>
          <hr class="border-slate-700 my-1.5">
          <div class="flex justify-between"><span class="info-label">Sàn</span><span class="info-value" id="cExchange">—</span></div>
          <div class="flex justify-between"><span class="info-label">Ngành</span><span class="info-value" id="cIndustry">—</span></div>
          <div class="flex justify-between"><span class="info-label">Vốn hóa</span><span class="info-value" id="cMcap">—</span></div>
          <div class="flex justify-between"><span class="info-label">SLCP</span><span class="info-value" id="cShares">—</span></div>
          <div class="flex justify-between"><span class="info-label">P/E</span><span class="info-value" id="cPE">—</span></div>
          <div class="flex justify-between"><span class="info-label">EPS</span><span class="info-value" id="cEPS">—</span></div>
        </div>
      `;
      try {
        const res = await fetch(`${API_BASE}/api/company/${stock.symbol}`);
        const info = await res.json();
        document.getElementById("companyName").textContent = info.full_name || info.name || stock.symbol;
        document.getElementById("cExchange").textContent = info.exchange || "—";
        document.getElementById("cIndustry").textContent = info.industry || "—";
      } catch {}

      try {
        const res = await fetch(`${API_BASE}/api/history/${stock.symbol}?days=800`);
        rawHistory = await res.json() || [];
      } catch { rawHistory = []; }

      currentTF = "D";
      document.querySelectorAll(".tf-btn").forEach(b =>
