<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 4px 6px; font-size: 12px; white-space: nowrap; }
    .info-label { color: #94a3b8; font-size: 11px; }
    .info-value { color: #e2e8f0; font-size: 12px; font-weight: 500; }
    .tf-btn { padding: 3px 10px; font-size: 12px; border-radius: 4px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .tf-btn.active { background: #1e40af; border-color: #3b82f6; }
    @media (min-width: 768px) {
      body { overflow: hidden; height: 100vh; }
      .main-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 40px); }
      .col-board { width: 340px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; }
      .col-info { width: 280px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; background: rgba(15,23,42,0.4); }
      .col-chart { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    }
    @media (max-width: 767px) {
      body { overflow: auto; min-height: 100vh; }
      .main-layout { display: block; }
      .col-board { width: 100%; max-height: 45vh; overflow: auto; border-bottom: 1px solid #334155; }
      .col-info { width: 100%; padding: 12px; border-bottom: 1px solid #334155; }
      .col-chart { width: 100%; height: 55vh; display: flex; flex-direction: column; }
    }
  </style>
</head>
<body class="flex flex-col">
  <div class="px-3 py-2 border-b border-slate-700 flex items-center gap-2 flex-shrink-0 flex-wrap">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" type="text" placeholder="Tìm mã..." class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto truncate">Đang tải...</p>
  </div>
  <div class="main-layout">
    <div class="col-board">
      <table class="w-full"><thead class="bg-slate-800 text-slate-300 sticky top-0 text-xs"><tr><th class="text-left">Mã</th><th class="text-right">Giá</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr></thead><tbody id="priceTable"></tbody></table>
    </div>
    <div class="col-info p-3"><div id="companyPanel"><p class="text-slate-500 text-sm text-center mt-6">Chọn mã để xem thông tin</p></div></div>
    <div class="col-chart">
      <div class="px-3 py-1.5 border-b border-slate-700 flex items-center gap-2 flex-shrink-0">
        <span id="chartTitle" class="text-xs text-slate-400 mr-1">Chart</span>
        <button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button>
        <button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button>
        <button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button>
      </div>
      <div id="chart" class="flex-1 w-full" style="min-height: 280px;"></div>
    </div>
  </div>
  <script>
    const VPS_BASE = "https://bgapidatafeed.vps.com.vn/getliststockdata";
    const CHART_BASE = "https://api.dnse.com.vn/chart-api/v2/ohlcs/stock";
    const CHART_FALLBACK = "https://services.entrade.com.vn/chart-api/v2/ohlcs/stock";
    const SYMBOLS = ["ACB","BCM","BID","BVH","CTG","FPT","GAS","GVR","HDB","HPG","MBB","MSN","MWG","PLX","SAB","SHB","SSB","SSI","STB","TCB","TPB","VCB","VHM","VIB","VIC","VJC","VNM","VPB","VRE","DGC","PNJ","REE","KDH","DXG"];
    const SHARES = {ACB:5.13e9,BCM:1.04e9,BID:6.90e9,BVH:0.74e9,CTG:5.37e9,FPT:1.47e9,GAS:1.91e9,GVR:4e9,HDB:3.48e9,HPG:6.4e9,MBB:6.12e9,MSN:1.43e9,MWG:1.46e9,PLX:1.29e9,SAB:1.28e9,SHB:3.66e9,SSB:2.84e9,SSI:1.96e9,STB:1.89e9,TCB:7.06e9,TPB:2.64e9,VCB:5.59e9,VHM:4.35e9,VIB:2.53e9,VIC:3.82e9,VJC:0.54e9,VNM:2.09e9,VPB:7.93e9,VRE:2.27e9,DGC:0.38e9,PNJ:0.34e9,REE:0.44e9,KDH:0.99e9,DXG:0.72e9};
    const COMPANY = {ACB:["Ngân hàng TMCP Á Châu","HOSE","Ngân hàng"],BCM:["Tổng CT Đầu tư và Phát triển Công nghiệp","HOSE","Bất động sản KCN"],BID:["Ngân hàng TMCP Đầu tư và Phát triển VN","HOSE","Ngân hàng"],BVH:["Tập đoàn Bảo Việt","HOSE","Bảo hiểm"],CTG:["Ngân hàng TMCP Công thương Việt Nam","HOSE","Ngân hàng"],FPT:["Công ty Cổ phần FPT","HOSE","Công nghệ"],GAS:["Tổng CT Khí Việt Nam","HOSE","Dầu khí"],GVR:["Tập đoàn Công nghiệp Cao su Việt Nam","HOSE","Cao su"],HDB:["Ngân hàng TMCP Phát triển TP.HCM","HOSE","Ngân hàng"],HPG:["Tập đoàn Hòa Phát","HOSE","Thép"],MBB:["Ngân hàng TMCP Quân đội","HOSE","Ngân hàng"],MSN:["Tập đoàn Masan","HOSE","Hàng tiêu dùng"],MWG:["Thế Giới Di Động","HOSE","Bán lẻ"],PLX:["Tập đoàn Xăng dầu Việt Nam","HOSE","Xăng dầu"],SAB:["Tổng CT Bia - Rượu - NGK Sài Gòn","HOSE","Đồ uống"],SHB:["Ngân hàng TMCP Sài Gòn - Hà Nội","HOSE","Ngân hàng"],SSB:["Ngân hàng TMCP Đông Nam Á","HOSE","Ngân hàng"],SSI:["CTCP Chứng khoán SSI","HOSE","Chứng khoán"],STB:["Ngân hàng TMCP Sài Gòn Thương Tín","HOSE","Ngân hàng"],TCB:["Ngân hàng TMCP Kỹ thương Việt Nam","HOSE","Ngân hàng"],TPB:["Ngân hàng TMCP Tiên Phong","HOSE","Ngân hàng"],VCB:["Ngân hàng TMCP Ngoại thương Việt Nam","HOSE","Ngân hàng"],VHM:["Vinhomes","HOSE","Bất động sản"],VIB:["Ngân hàng TMCP Quốc tế Việt Nam","HOSE","Ngân hàng"],VIC:["Tập đoàn Vingroup","HOSE","Đa ngành"],VJC:["Vietjet Air","HOSE","Hàng không"],VNM:["Vinamilk","HOSE","Thực phẩm"],VPB:["Ngân hàng TMCP Việt Nam Thịnh Vượng","HOSE","Ngân hàng"],VRE:["Vincom Retail","HOSE","Bán lẻ"],DGC:["Hóa chất Đức Giang","HOSE","Hóa chất"],PNJ:["Vàng bạc Đá quý Phú Nhuận","HOSE","Bán lẻ"],REE:["Cơ điện lạnh","HOSE","Điện / cơ điện"],KDH:["Nhà Khang Điền","HOSE","Bất động sản"],DXG:["Đất Xanh Group","HOSE","Bất động sản"]};
    const RULES = { rsiPeriod: 14, bbPeriod: 10, bbMult: 0.9, maPeriod: 8, minValue: 2e9, minMcap: 500e9 };
    let stocks = [], filteredStocks = [], selectedSymbol = null, histories = {};
    let chart = null, candleSeries = null, volumeSeries = null, rawHistory = [], currentTF = "D";
    function toVnd(v) { const n = Number(v); if (!Number.isFinite(n) || n === 0) return 0; return n < 1000 ? Math.round(n * 1000) : Math.round(n); }
    function sma(values, n) { if (values.length < n) return null; let s = 0; for (let i = values.length - n; i < values.length; i++) s += values[i]; return s / n; }
    function rsiSeries(closes, period) { const out = new Array(closes.length).fill(null); if (closes.length <= period) return out; let gain = 0, loss = 0; for (let i = 1; i <= period; i++) { const ch = closes[i] - closes[i - 1]; if (ch >= 0) gain += ch; else loss -= ch; } let avgG = gain / period, avgL = loss / period; out[period] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL); for (let i = period + 1; i < closes.length; i++) { const ch = closes[i] - closes[i - 1]; const g = ch > 0 ? ch : 0; const l = ch < 0 ? -ch : 0; avgG = (avgG * (period - 1) + g) / period; avgL = (avgL * (period - 1) + l) / period; out[i] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL); } return out; }
    function bbAt(series, index, period, mult) { if (index < period - 1 || series[index] == null) return null; const win = []; for (let i = index - period + 1; i <= index; i++) { if (series[i] == null) return null; win.push(series[i]); } const mid = win.reduce((a, b) => a + b, 0) / period; const sd = Math.sqrt(win.reduce((a, b) => a + (b - mid) ** 2, 0) / period); return { upper: mid + mult * sd }; }
    function evaluate(stock) { const bars = histories[stock.symbol]; if (!bars || bars.length < 30) return { pass: false }; const closes = bars.map(b => b.close); closes[closes.length - 1] = stock.price || closes[closes.length - 1]; const vols = bars.map(b => b.volume); vols[vols.length - 1] = stock.volume || vols[vols.length - 1]; const ma = sma(closes, RULES.maPeriod); const maPrev = sma(closes.slice(0, -1), RULES.maPeriod); const priceOk = ma != null && stock.price > ma; const maUp = ma != null && maPrev != null && ma > maPrev; const rsi = rsiSeries(closes, RULES.rsiPeriod); const i = closes.length - 1; const bb = bbAt(rsi, i, RULES.bbPeriod, RULES.bbMult); const bbPrev = bbAt(rsi, i - 1, RULES.bbPeriod, RULES.bbMult); const cross = bb && bbPrev && rsi[i] != null && rsi[i - 1] != null && rsi[i - 1] <= bbPrev.upper && rsi[i] > bb.upper; const last5 = closes.slice(-5).map((c, k) => c * vols[vols.length - 5 + k]); const avgValue = last5.reduce((a, b) => a + b, 0) / last5.length; const shares = SHARES[stock.symbol]; const mcap = shares ? shares * stock.price : null; return { pass: priceOk && maUp && cross && avgValue > RULES.minValue && mcap != null && mcap > RULES.minMcap }; }
    function mapVps(row) { const last = Number(row.lastPrice || 0); const ref = Number(row.r || 0); return { symbol: row.sym, price: toVnd(last || row.closePrice), change: (last - ref) * 1000, percent: ref ? (last - ref) / ref * 100 : 0, volume: Number(row.lot || 0) * 10, ceiling: toVnd(row.c), floor: toVnd(row.f), high: toVnd(row.highPrice), low: toVnd(row.lowPrice), ref: toVnd(ref) }; }
    function paint() { if (!stocks.length) return; stocks.forEach(s => { s.signal = evaluate(s); }); applyFilter(); const hit = stocks.filter(s => s.signal && s.signal.pass).length; document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${hit} mã`; }
    async function fetchBoard() { try { const res = await fetch(`${VPS_BASE}/${SYMBOLS.join(",")}`); if (!res.ok) return; const data = await res.json(); if (Array.isArray(data) && data.length) { stocks = data.map(mapVps).filter(s => s.symbol); paint(); } } catch { document.getElementById("status").textContent = "Đang tải..."; } }
    function applyFilter() { const keyword = document.getElementById("searchInput").value.trim().toUpperCase(); filteredStocks = stocks.filter(s => (!keyword || s.symbol.includes(keyword)) && s.signal && s.signal.pass); renderTable(); }
    function renderTable() { const tbody = document.getElementById("priceTable"); tbody.innerHTML = ""; if (!filteredStocks.length) { tbody.innerHTML = `<tr><td colspan="5" class="text-slate-500 text-center py-4">Chưa có mã</td></tr>`; return; } filteredStocks.forEach(s => { const tr = document.createElement("tr"); tr.className = selectedSymbol === s.symbol ? "selected" : ""; tr.onclick = () => selectStock(s); const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref"; tr.innerHTML = `<td class="font-bold">${s.symbol}</td><td class="text-right ${cls}">${Number(s.price || 0).toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.change > 0 ? "+" : ""}${Number(s.change || 0).toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.percent > 0 ? "+" : ""}${Number(s.percent || 0).toFixed(2)}</td><td class="text-right text-slate-500">${(Number(s.volume || 0) / 1000).toFixed(0)}K</td>`; tbody.appendChild(tr); }); }
    function ensureChart() { const el = document.getElementById("chart"); if (chart) return; chart = LightweightCharts.createChart(el, { layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" }, grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } }, rightPriceScale: { borderColor: "#334155" }, timeScale: { borderColor: "#334155" }, autoSize: true }); candleSeries = chart.addCandlestickSeries({ upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444" }); volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" }); chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } }); new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight })).observe(el); }
    function normalizeBar(bar) { const time = Number(bar.time || bar.t); return { time: time > 1e12 ? Math.floor(time / 1000) : time, open: toVnd(bar.open ?? bar.o), high: toVnd(bar.high ?? bar.h), low: toVnd(bar.low ?? bar.l), close: toVnd(bar.close ?? bar.c), volume: Number(bar.volume ?? bar.v ?? 0) }; }
    async function loadHistory(symbol) { const to = Math.floor(Date.now() / 1000); const from = to - 160 * 86400; for (const base of [CHART_BASE, CHART_FALLBACK]) { try { const res = await fetch(`${base}?symbol=${symbol}&resolution=1D&from=${from}&to=${to}`); if (!res.ok) continue; const data = await res.json(); if (data && Array.isArray(data.t) && data.t.length) return data.t.map((t, i) => normalizeBar({ time: t, open: data.o[i], high: data.h[i], low: data.l[i], close: data.c[i], volume: data.v[i] })).slice(-120); } catch {} } return []; }
    function loadCache() { try { const saved = JSON.parse(localStorage.getItem("ss_h") || "null"); if (saved && saved.data && Date.now() - saved.at < 6 * 3600 * 1000) histories = saved.data; } catch {} }
    function saveCache() { try { const data = {}; for (const k of Object.keys(histories)) if (histories[k] && histories[k].length) data[k] = histories[k].slice(-120); localStorage.setItem("ss_h", JSON.stringify({ at: Date.now(), data })); } catch {} }
    async function pool(items, limit, fn) { let i = 0; await Promise.all(Array.from({ length: limit }, async () => { while (i < items.length) { const symbol = items[i++]; await fn(symbol); } })); }
    async function warmHistories() { loadCache(); paint(); const missing = SYMBOLS.filter(s => !histories[s] || !histories[s].length); await pool(missing.length ? missing : SYMBOLS, 8, async symbol => { const fresh = await loadHistory(symbol); if (fresh.length) histories[symbol] = fresh; paint(); }); saveCache(); }
    function bucketKey(time, tf) { const d = new Date(time * 1000); if (tf === "M") return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000; if (tf === "W") { const day = d.getUTCDay() || 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 1) / 1000; } return time; }
    function aggregate(bars, tf) { if (tf === "D") return bars; const map = new Map(); bars.forEach(b => { const key = bucketKey(b.time, tf); const cur = map.get(key); if (!cur) map.set(key, { ...b, time: key }); else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; } }); return [...map.values()]; }
    function drawChart() { ensureChart(); const bars = aggregate(rawHistory, currentTF).filter(b => b.time && b.open); candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close }))); volumeSeries.setData(bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? "rgba(34,197,94,0.45)" : "rgba(239,68,68,0.45)" }))); chart.timeScale().fitContent(); }
    function changeTimeframe(tf) { currentTF = tf; document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf)); if (rawHistory.length) drawChart(); }
    async function selectStock(stock) { selectedSymbol = stock.symbol; renderTable(); document.getElementById("chartTitle").textContent = stock.symbol; const meta = COMPANY[stock.symbol] || [stock.symbol, "—", "—"]; const cls = stock.change > 0 ? "up" : stock.change < 0 ? "down" : "ref"; document.getElementById("companyPanel").innerHTML = `<div class="mb-2"><div class="text-lg font-bold text-blue-400">${stock.symbol}</div><div class="text-sm text-slate-300 mt-0.5">${meta[0]}</div></div><div class="space-y-1.5 text-sm"><div class="flex justify-between"><span class="info-label">Giá</span><span class="info-value ${cls}">${Number(stock.price || 0).toLocaleString("vi-VN")}</span></div><div class="flex justify-between"><span class="info-label">Thay đổi</span><span class="info-value ${cls}">${stock.change > 0 ? "+" : ""}${Number(stock.change || 0).toLocaleString("vi-VN")} (${Number(stock.percent || 0).toFixed(2)}%)</span></div><div class="flex justify-between"><span class="info-label">Khối lượng</span><span class="info-value">${Number(stock.volume || 0).toLocaleString("vi-VN")}</span></div><div class="flex justify-between"><span class="info-label">Trần / Sàn</span><span class="info-value">${Number(stock.ceiling || 0).toLocaleString("vi-VN")} / ${Number(stock.floor || 0).toLocaleString("vi-VN")}</span></div><hr class="border-slate-700 my-1.5"><div class="flex justify-between"><span class="info-label">Sàn</span><span class="info-value">${meta[1]}</span></div><div class="flex justify-between"><span class="info-label">Ngành</span><span class="info-value">${meta[2]}</span></div></div>`; rawHistory = histories[stock.symbol] && histories[stock.symbol].length ? histories[stock.symbol] : await loadHistory(stock.symbol); histories[stock.symbol] = rawHistory; currentTF = "D"; document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === "D")); if (rawHistory.length) drawChart(); }
    document.getElementById("searchInput").addEventListener("input", applyFilter);
    loadCache(); fetchBoard(); warmHistories(); setInterval(fetchBoard, 15000);
  </script>
</body>
</html>
