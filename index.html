<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
    .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; }
    .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 4px 6px; font-size: 12px; white-space: nowrap; }
    .info-label { color: #94a3b8; font-size: 11px; }
    .info-value { color: #e2e8f0; font-size: 12px; font-weight: 500; }
    .tf-btn { padding: 3px 10px; font-size: 12px; border-radius: 4px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .tf-btn.active { background: #1e40af; border-color: #3b82f6; }

    @media (min-width: 768px) {
      body { overflow: hidden; height: 100vh; }
      .main-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 40px); }
      .col-board { width: 280px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; }
      .col-info { width: 280px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; background: rgba(15,23,42,0.4); }
      .col-chart { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    }

    @media (max-width: 767px) {
      body { overflow: auto; min-height: 100vh; }
      .main-layout { display: block; }
      .col-board { width: 100%; max-height: 45vh; overflow: auto; border-bottom: 1px solid #334155; }
      .col-info { width: 100%; padding: 12px; border-bottom: 1px solid #334155; }
      .col-chart { width: 100%; height: 55vh; display: flex; flex-direction: column; }
    }
  </style>
</head>
<body class="flex flex-col">
  <div class="px-3 py-2 border-b border-slate-700 flex items-center gap-2 flex-shrink-0">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" type="text" placeholder="Tìm mã..."
           class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto truncate">Đang tải bảng giá...</p>
  </div>

  <div class="main-layout">
    <div class="col-board">
      <table class="w-full">
        <thead class="bg-slate-800 text-slate-300 sticky top-0 text-xs">
          <tr>
            <th class="text-left">Mã</th>
            <th class="text-right">Giá</th>
            <th class="text-right">±</th>
            <th class="text-right">%</th>
            <th class="text-right">KL</th>
          </tr>
        </thead>
        <tbody id="priceTable"></tbody>
      </table>
    </div>

    <div class="col-info p-3">
      <div id="companyPanel">
        <p class="text-slate-500 text-sm text-center mt-6">Chọn mã để xem thông tin</p>
      </div>
    </div>

    <div class="col-chart">
      <div class="px-3 py-1.5 border-b border-slate-700 flex items-center gap-2 flex-shrink-0">
        <span id="chartTitle" class="text-xs text-slate-400 mr-1">Chart</span>
        <button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button>
        <button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button>
        <button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button>
      </div>
      <div id="chart" class="flex-1 w-full" style="min-height: 280px;"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://skystock-api-1.onrender.com";
    const VPS_BASE = "https://bgapidatafeed.vps.com.vn/getliststockdata";
    const CHART_BASE = "https://services.entrade.com.vn/chart-api/v2/ohlcs/stock";
    const SYMBOLS = ["ACB","BCM","BID","BVH","CTG","FPT","GAS","GVR","HDB","HPG","MBB","MSN","MWG","PLX","SAB","SHB","SSB","SSI","STB","TCB","TPB","VCB","VHM","VIB","VIC","VJC","VNM","VPB","VRE","DGC","PNJ","REE","KDH","DXG"];

    const COMPANY = {
      ACB: ["Ngân hàng TMCP Á Châu", "HOSE", "Ngân hàng"],
      BCM: ["Tổng CT Đầu tư và Phát triển Công nghiệp", "HOSE", "Bất động sản KCN"],
      BID: ["Ngân hàng TMCP Đầu tư và Phát triển VN", "HOSE", "Ngân hàng"],
      BVH: ["Tập đoàn Bảo Việt", "HOSE", "Bảo hiểm"],
      CTG: ["Ngân hàng TMCP Công thương Việt Nam", "HOSE", "Ngân hàng"],
      FPT: ["Công ty Cổ phần FPT", "HOSE", "Công nghệ"],
      GAS: ["Tổng CT Khí Việt Nam", "HOSE", "Dầu khí"],
      GVR: ["Tập đoàn Công nghiệp Cao su Việt Nam", "HOSE", "Cao su"],
      HDB: ["Ngân hàng TMCP Phát triển TP.HCM", "HOSE", "Ngân hàng"],
      HPG: ["Tập đoàn Hòa Phát", "HOSE", "Thép"],
      MBB: ["Ngân hàng TMCP Quân đội", "HOSE", "Ngân hàng"],
      MSN: ["Tập đoàn Masan", "HOSE", "Hàng tiêu dùng"],
      MWG: ["Thế Giới Di Động", "HOSE", "Bán lẻ"],
      PLX: ["Tập đoàn Xăng dầu Việt Nam", "HOSE", "Xăng dầu"],
      SAB: ["Tổng CT Bia - Rượu - NGK Sài Gòn", "HOSE", "Đồ uống"],
      SHB: ["Ngân hàng TMCP Sài Gòn - Hà Nội", "HOSE", "Ngân hàng"],
      SSB: ["Ngân hàng TMCP Đông Nam Á", "HOSE", "Ngân hàng"],
      SSI: ["CTCP Chứng khoán SSI", "HOSE", "Chứng khoán"],
      STB: ["Ngân hàng TMCP Sài Gòn Thương Tín", "HOSE", "Ngân hàng"],
      TCB: ["Ngân hàng TMCP Kỹ thương Việt Nam", "HOSE", "Ngân hàng"],
      TPB: ["Ngân hàng TMCP Tiên Phong", "HOSE", "Ngân hàng"],
      VCB: ["Ngân hàng TMCP Ngoại thương Việt Nam", "HOSE", "Ngân hàng"],
      VHM: ["Vinhomes", "HOSE", "Bất động sản"],
      VIB: ["Ngân hàng TMCP Quốc tế Việt Nam", "HOSE", "Ngân hàng"],
      VIC: ["Tập đoàn Vingroup", "HOSE", "Đa ngành"],
      VJC: ["Vietjet Air", "HOSE", "Hàng không"],
      VNM: ["Vinamilk", "HOSE", "Thực phẩm"],
      VPB: ["Ngân hàng TMCP Việt Nam Thịnh Vượng", "HOSE", "Ngân hàng"],
      VRE: ["Vincom Retail", "HOSE", "Bán lẻ"],
      DGC: ["Hóa chất Đức Giang", "HOSE", "Hóa chất"],
      PNJ: ["Vàng bạc Đá quý Phú Nhuận", "HOSE", "Bán lẻ"],
      REE: ["Cơ điện lạnh", "HOSE", "Điện / cơ điện"],
      KDH: ["Nhà Khang Điền", "HOSE", "Bất động sản"],
      DXG: ["Đất Xanh Group", "HOSE", "Bất động sản"]
    };

    let stocks = [], filteredStocks = [], selectedSymbol = null;
    let chart = null, candleSeries = null, volumeSeries = null;
    let rawHistory = [], currentTF = "D";
    let dataSource = "";

    function toVnd(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n === 0) return 0;
      return n < 1000 ? Math.round(n * 1000) : Math.round(n);
    }

    function mapVps(row) {
      const last = Number(row.lastPrice || 0);
      const ref = Number(row.r || 0);
      const change = (last - ref) * 1000;
      const percent = ref ? (last - ref) / ref * 100 : 0;
      return {
        symbol: row.sym,
        price: toVnd(last || row.closePrice),
        change,
        percent,
        volume: Number(row.lot || 0) * 10,
        ceiling: toVnd(row.c),
        floor: toVnd(row.f),
        high: toVnd(row.highPrice),
        low: toVnd(row.lowPrice),
        ref: toVnd(ref)
      };
    }

    async function fetchBoard() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(`${VPS_BASE}/${SYMBOLS.join(",")}`);
        if (!res.ok) throw new Error("VPS " + res.status);
        const data = await res.json();
        if (Array.isArray(data) && data.length) {
          stocks = data.map(mapVps).filter(s => s.symbol);
          dataSource = "VPS";
          applyFilter();
          statusEl.textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filteredStocks.length} mã • ${dataSource}`;
          return;
        }
      } catch (err) {
        statusEl.textContent = "VPS lỗi, đang gọi backend...";
      }

      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 50000);
        const res = await fetch(`${API_BASE}/api/board?symbols=${SYMBOLS.join(",")}`, { signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        if (Array.isArray(data) && data.length) {
          stocks = data;
          dataSource = "SkyStock API";
          applyFilter();
          statusEl.textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filteredStocks.length} mã • ${dataSource}`;
          return;
        }
        statusEl.textContent = "Backend không trả dữ liệu";
      } catch {
        statusEl.textContent = "Không tải được bảng giá";
      }
    }

    function applyFilter() {
      const keyword = document.getElementById("searchInput").value.trim().toUpperCase();
      filteredStocks = stocks.filter(s => s.symbol && (!keyword || s.symbol.includes(keyword)));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("priceTable");
      tbody.innerHTML = "";
      filteredStocks.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = selectedSymbol === s.symbol ? "selected" : "";
        tr.onclick = () => selectStock(s);
        const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref";
        tr.innerHTML = `
          <td class="font-bold">${s.symbol}</td>
          <td class="text-right ${cls}">${Number(s.price || 0).toLocaleString("vi-VN")}</td>
          <td class="text-right ${cls}">${s.change > 0 ? "+" : ""}${Number(s.change || 0).toLocaleString("vi-VN")}</td>
          <td class="text-right ${cls}">${s.percent > 0 ? "+" : ""}${Number(s.percent || 0).toFixed(2)}</td>
          <td class="text-right text-slate-500">${(Number(s.volume || 0) / 1000).toFixed(0)}K</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function ensureChart() {
      const el = document.getElementById("chart");
      if (chart) return;
      chart = LightweightCharts.createChart(el, {
        layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" },
        grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } },
        rightPriceScale: { borderColor: "#334155" },
        timeScale: { borderColor: "#334155", timeVisible: false },
        crosshair: { mode: 0 },
        autoSize: true
      });
      candleSeries = chart.addCandlestickSeries({
        upColor: "#22c55e", downColor: "#ef4444", borderVisible: false,
        wickUpColor: "#22c55e", wickDownColor: "#ef4444"
      });
      volumeSeries = chart.addHistogramSeries({
        priceFormat: { type: "volume" },
        priceScaleId: "vol"
      });
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
      new ResizeObserver(() => {
        chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
      }).observe(el);
    }

    function normalizeBar(bar) {
      const time = Number(bar.time || bar.t);
      return {
        time: time > 1e12 ? Math.floor(time / 1000) : time,
        open: toVnd(bar.open ?? bar.o),
        high: toVnd(bar.high ?? bar.h),
        low: toVnd(bar.low ?? bar.l),
        close: toVnd(bar.close ?? bar.c),
        volume: Number(bar.volume ?? bar.v ?? 0)
      };
    }

    async function loadHistory(symbol) {
      try {
        const res = await fetch(`${API_BASE}/api/history/${symbol}?days=800`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length) return data.map(normalizeBar);
        }
      } catch {}

      try {
        const to = Math.floor(Date.now() / 1000);
        const from = to - 800 * 86400;
        const res = await fetch(`${CHART_BASE}?symbol=${symbol}&resolution=1D&from=${from}&to=${to}`);
        if (!res.ok) return [];
        const data = await res.json();
        if (!data || !Array.isArray(data.t)) return [];
        return data.t.map((t, i) => normalizeBar({
          time: t, open: data.o[i], high: data.h[i], low: data.l[i], close: data.c[i], volume: data.v[i]
        }));
      } catch {
        return [];
      }
    }

    function bucketKey(time, tf) {
      const d = new Date(time * 1000);
      if (tf === "M") return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000;
      if (tf === "W") {
        const day = d.getUTCDay() || 7;
        const monday = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 1) / 1000;
        return monday;
      }
      return time;
    }

    function aggregate(bars, tf) {
      if (tf === "D") return bars;
      const map = new Map();
      bars.forEach(b => {
        const key = bucketKey(b.time, tf);
        const cur = map.get(key);
        if (!cur) {
          map.set(key, { ...b, time: key });
        } else {
          cur.high = Math.max(cur.high, b.high);
          cur.low = Math.min(cur.low, b.low);
          cur.close = b.close;
          cur.volume += b.volume;
        }
      });
      return [...map.values()];
    }

    function drawChart() {
      ensureChart();
      const bars = aggregate(rawHistory, currentTF).filter(b => b.time && b.open);
      candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
      volumeSeries.setData(bars.map(b => ({
        time: b.time,
        value: b.volume,
        color: b.close >= b.open ? "rgba(34,197,94,0.45)" : "rgba(239,68,68,0.45)"
      })));
      chart.timeScale().fitContent();
    }

    function changeTimeframe(tf) {
      currentTF = tf;
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf));
      if (rawHistory.length) drawChart();
    }

    async function selectStock(stock) {
      selectedSymbol = stock.symbol;
      renderTable();
      document.getElementById("chartTitle").textContent = stock.symbol;
      const meta = COMPANY[stock.symbol] || [stock.symbol, "—", "—"];
      const cls = stock.change > 0 ? "up" : stock.change < 0 ? "down" : "ref";
      const panel = document.getElementById("companyPanel");
      panel.innerHTML = `
        <div class="mb-2">
          <div class="text-lg font-bold text-blue-400">${stock.symbol}</div>
          <div class="text-sm text-slate-300 mt-0.5" id="companyName">${meta[0]}</div>
        </div>
        <div class="space-y-1.5 text-sm">
          <div class="flex justify-between"><span class="info-label">Giá</span><span class="info-value ${cls}">${Number(stock.price || 0).toLocaleString("vi-VN")}</span></div>
          <div class="flex justify-between"><span class="info-label">Thay đổi</span><span class="info-value ${cls}">${stock.change > 0 ? "+" : ""}${Number(stock.change || 0).toLocaleString("vi-VN")} (${Number(stock.percent || 0).toFixed(2)}%)</span></div>
          <div class="flex justify-between"><span class="info-label">Khối lượng</span><span class="info-value">${Number(stock.volume || 0).toLocaleString("vi-VN")}</span></div>
          <div class="flex justify-between"><span class="info-label">Cao / Thấp</span><span class="info-value">${Number(stock.high || 0).toLocaleString("vi-VN")} / ${Number(stock.low || 0).toLocaleString("vi-VN")}</span></div>
          <div class="flex justify-between"><span class="info-label">Trần / Sàn</span><span class="info-value">${Number(stock.ceiling || 0).toLocaleString("vi-VN")} / ${Number(stock.floor || 0).toLocaleString("vi-VN")}</span></div>
          <hr class="border-slate-700 my-1.5">
          <div class="flex justify-between"><span class="info-label">Sàn</span><span class="info-value" id="cExchange">${meta[1]}</span></div>
          <div class="flex justify-between"><span class="info-label">Ngành</span><span class="info-value" id="cIndustry">${meta[2]}</span></div>
          <div class="flex justify-between"><span class="info-label">Tham chiếu</span><span class="info-value">${Number(stock.ref || 0).toLocaleString("vi-VN")}</span></div>
        </div>
      `;

      try {
        const res = await fetch(`${API_BASE}/api/company/${stock.symbol}`);
        if (res.ok) {
          const info = await res.json();
          const nameEl = document.getElementById("companyName");
          if (nameEl) nameEl.textContent = info.full_name || info.name || meta[0];
          const ex = document.getElementById("cExchange");
          const ind = document.getElementById("cIndustry");
          if (ex && info.exchange) ex.textContent = info.exchange;
          if (ind && info.industry) ind.textContent = info.industry;
        }
      } catch {}

      rawHistory = await loadHistory(stock.symbol);
      currentTF = "D";
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === "D"));
      if (rawHistory.length) drawChart();
      else document.getElementById("chartTitle").textContent = stock.symbol + " • chưa có chart";
    }

    document.getElementById("searchInput").addEventListener("input", applyFilter);
    fetchBoard();
    setInterval(fetchBoard, 15000);
    setTimeout(() => fetch(`${API_BASE}/api/board?symbols=FPT`).catch(() => {}), 200);
  </script>
</body>
</html>
