<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bảng giá Chứng khoán Việt Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0; }
    .up { color: #22c55e; } .down { color: #ef4444; } .ref { color: #facc15; }
    tr:hover { background: #1e293b; cursor: pointer; } .selected { background: #1e3a5f !important; }
    #priceTable td, #priceTable th { padding: 4px 6px; font-size: 12px; white-space: nowrap; }
    .info-label { color: #94a3b8; font-size: 11px; } .info-value { color: #e2e8f0; font-size: 12px; font-weight: 500; }
    .tf-btn { padding: 3px 10px; font-size: 12px; border-radius: 4px; background: #1e293b; border: 1px solid #334155; cursor: pointer; }
    .tf-btn.active { background: #1e40af; border-color: #3b82f6; }
    @media (min-width: 768px) { body { overflow: hidden; height: 100vh; } .main-layout { display: flex; overflow: hidden; height: calc(100vh - 40px); } .col-board { width: 340px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; } .col-info { width: 280px; flex-shrink: 0; overflow: auto; border-right: 1px solid #334155; } .col-chart { flex: 1; display: flex; flex-direction: column; overflow: hidden; } }
    @media (max-width: 767px) { .main-layout { display: block; } .col-board { max-height: 45vh; overflow: auto; } .col-info { padding: 12px; } .col-chart { height: 55vh; display: flex; flex-direction: column; } }
  </style>
</head>
<body class="flex flex-col">
  <div class="px-3 py-2 border-b border-slate-700 flex items-center gap-2">
    <h1 class="text-base font-bold">Bảng giá CK</h1>
    <input id="searchInput" type="text" placeholder="Tìm mã..." class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm w-24 focus:outline-none" />
    <p id="status" class="text-xs text-slate-400 ml-auto truncate">Đang tải...</p>
  </div>
  <div class="main-layout">
    <div class="col-board"><table class="w-full"><thead class="bg-slate-800 text-slate-300 sticky top-0 text-xs"><tr><th class="text-left">Mã</th><th class="text-right">Giá</th><th class="text-right">±</th><th class="text-right">%</th><th class="text-right">KL</th></tr></thead><tbody id="priceTable"></tbody></table></div>
    <div class="col-info p-3"><div id="companyPanel"><p class="text-slate-500 text-sm text-center mt-6">Chọn mã để xem thông tin</p></div></div>
    <div class="col-chart"><div class="px-3 py-1.5 border-b border-slate-700 flex items-center gap-2"><span id="chartTitle" class="text-xs text-slate-400 mr-1">Chart</span><button class="tf-btn active" data-tf="D" onclick="changeTimeframe('D')">Ngày</button><button class="tf-btn" data-tf="W" onclick="changeTimeframe('W')">Tuần</button><button class="tf-btn" data-tf="M" onclick="changeTimeframe('M')">Tháng</button></div><div id="chart" class="flex-1 w-full" style="min-height:280px"></div></div>
  </div>
  <script>
    const VPS_BASE = "https://bgapidatafeed.vps.com.vn/getliststockdata";
    const CHART_BASE = "https://api.dnse.com.vn/chart-api/v2/ohlcs/stock";
    const MIN_MCAP = 500e9;
    const RULES = { rsiPeriod: 14, bbPeriod: 10, bbMult: 0.9, maPeriod: 8, minValue: 2e9 };
    const SHARES = Object.fromEntries("AAA:393742720,AAN:65000000,ABT:11777257,ACB:5804422000,ACG:150787952,ACL:50159020,ADP:23039850,ADS:76394730,AGG:178779984,AGR:228311776,ANV:266255744,APG:223621936,APH:243884272,ASM:407194176,ASP:37339544,BAB:1152550660,BAF:364824900,BCC:123209808,BCF:42140896,BCM:1035000000,BFC:57167990,BHN:231800000,BIC:202067056,BID:7778229000,BKC:30206636,BMI:150547632,BMP:81860936,BSI:269901536,BSR:5007299580,BTS:123559856,BVB:961230000,BVH:742322752,BVS:72200140,BWE:251347024,CAP:15269965,CDC:105545320,CDN:99000000,CEO:595775744,CHP:157658080,CII:671985300,CKG:161807520,CLL:34000000,CLM:14464925,CMG:232891900,CNG:35099296,CRC:106699920,CRE:463678432,CRV:687399900,CSM:103625264,CST:42846772,CSV:110499912,CTD:111823216,CTF:95653860,CTG:7766945000,CTI:69299864,CTR:128109536,CTS:272244928,CVT:36690890,DAT:69228344,DBC:431046500,DBD:94489260,DCL:73041030,DCM:529400000,DGC:379778400,DGW:223361000,DHA:14726073,DHC:106249616,DHG:130746072,DHT:99631440,DIG:844192800,DLG:299309728,DMC:34727464,DMX:1267722000,DNP:140966032,DPG:118587096,DPM:679925000,DPR:86885940,DRC:154429280,DSC:278362752,DSE:428249800,DTD:73353790,DTK:682767500,DVP:40000000,DXG:1268105000,DXP:59910132,DXS:579103100,EIB:1862720640,ELC:117748112,EVF:760565800,EVG:226011744,EVS:164800624,FCN:157439000,FIT:339933024,FMC:65388890,FPT:1885727620,FRT:178815056,FTS:380915800,GAS:2412949760,GEE:640499200,GEG:376220500,GEL:790000000,GEX:1308471300,GHC:47662500,GIL:101596216,GMD:649338752,GSP:74268420,GVR:4000000000,HAG:1267399300,HAH:191840400,HAP:110942300,HAX:107439680,HCM:1371945860,HDB:5005276000,HDC:229712448,HDG:406957344,HGM:12600000,HHC:16425000,HHP:92179690,HHS:431986000,HHV:574511900,HII:73663016,HLD:54999960,HPA:285000000,HPG:8442964480,HPX:304168576,HQC:626599300,HRC:30206622,HSG:807262700,HTG:43202390,HTN:133674440,HUT:1068285570,HVH:71742430,HVN:3111498240,HVT:27470046,ICT:32185000,IDC:417446848,IDI:273172672,IDJ:173490192,IDV:47421880,IJC:629580700,ILB:38199492,IMP:154008960,IPA:245911040,ITC:101689856,IVS:104923336,KBC:941754752,KDC:276345300,KDH:1234436350,KHG:449435200,KHP:62186520,KLB:748988352,KOS:216481328,KSB:114443704,KSF:899787300,KSV:299999800,LAS:112856400,LBM:50000000,LCG:206602128,LDG:255615856,LHC:28800000,LHG:50012010,LIX:64800000,LPB:2987282180,LSS:90026590,MBB:10068750000,MBS:1000933440,MCH:1307404930,MCM:110000000,MCP:19868148,MIG:211503456,MSB:3744000000,MSH:112521024,MSN:1460374660,MST:113604224,MVB:105000000,MWG:1475694080,MZG:128157064,NAB:2158822400,NAF:61181990,NBB:100475656,NCT:26165732,NDN:71657940,NET:22398374,NHA:71266850,NHH:112964000,NKG:492323968,NLG:485097376,NNC:21920000,NTC:23999980,NTH:10802053,NTL:121979900,NTP:205245200,NVB:2924632830,NVL:3202757380,OCB:3062510000,OCH:200000000,OGC:300000000,ORS:623930900,PAC:76677624,PAN:250673168,PCH:27188476,PCT:80035496,PDN:55565820,PDR:997809400,PDV:79314930,PET:154743760,PGC:60339284,PGD:98997310,PGS:49998790,PGV:1213344900,PHR:243897800,PLC:80797570,PLX:1293878140,PNJ:511721952,POW:3067845630,PPC:320613056,PRE:104400000,PSD:70236110,PTB:100407072,PTI:120592128,PVC:81194460,PVD:927742200,PVI:257664976,PVP:103702448,PVS:613699300,PVT:516918944,QCG:275129152,QNP:40409950,RAL:23547420,REE:623399040,RYG:75149970,SAB:1282562430,SAF:12046590,SAM:402753344,SBA:60488260,SBG:61841416,SBT:934634200,SCG:85000000,SCR:430595040,SCS:95907680,SFI:24647034,SGC:7147580,SGN:33498592,SGR:83849860,SGT:148003200,SHB:5343704000,SHI:169949552,SHN:129607144,SHP:101206352,SHS:899462200,SIP:242112944,SJD:68998620,SJS:297474800,SLS:9791945,SMB:29846648,SMC:73606840,SRC:36481730,SSB:3468800000,SSI:3001302270,STB:1885215740,STG:98253360,STK:154135024,SVC:93267790,SZB:30000000,SZC:179985856,SZL:48198884,TAL:503999700,TBC:63500000,TCB:7086240260,TCH:1003312830,TCI:115620960,TCL:30158436,TCM:117638624,TCO:57320624,TCX:3329340000,TDC:127228000,TDP:103069384,TEG:120806560,TFC:16829994,THD:384999968,THG:35176308,TIG:193606200,TIP:65007856,TLD:77741360,TLG:96528340,TMB:15000000,TMP:70000000,TNG:128731264,TNH:165726944,TPB:3190154000,TRA:82901080,TRC:120000000,TSA:41224990,TTA:178559088,TTF:393532448,TVB:109121520,TVC:76155570,TVS:244643472,TYA:30680582,VAB:902075100,VBB:1184586620,VCB:8355675000,VCF:26579136,VCG:698176256,VCI:1152232000,VCK:2434919680,VCS:160000000,VDP:32016376,VDS:272000000,VFG:41712616,VFS:153963440,VGC:448350000,VGS:61524156,VHC:209453152,VHM:8214824000,VIB:3735386370,VIC:7762186000,VIF:350000000,VIP:68470940,VIT:79808800,VIX:2572788480,VJC:769094700,VNC:20999112,VND:1522299900,VNM:2089955460,VNR:210661280,VOS:140000000,VPB:10000000000,VPD:106589632,VPI:352054368,VPL:1793300350,VPX:1875000000,VRC:50000000,VRE:2272318460,VSC:374370368,VSH:236241248,VTO:79866664,VTP:201885168,VTZ:76159830,VVS:43050000,WCS:2999967,YEG:205226448".split(",").map(x => x.split(":")).map(([s, sh]) => [s, Number(sh)]));
    const HNX = new Set("BAB,BCC,BCF,BKC,BTS,BVS,CAP,CDN,CEO,CLM,CST,DHT,DNP,DTD,DTK,DXP,EVS,HGM,HHC,HLD,HUT,HVT,IDC,IDJ,IDV,IPA,IVS,KSF,KSV,LAS,LHC,MBS,MST,MVB,NDN,NET,NTH,NTP,NVB,OCH,PCH,PCT,PGS,PLC,PRE,PSD,PTI,PVC,PVI,PVS,SAF,SCG,SGC,SHN,SHS,SLS,SZB,TFC,THD,TIG,TMB,TNG,TVC,VCS,VFS,VGS,VIF,VIT,VNC,VNR,VTZ,WCS".split(","));
    const SYMBOLS = Object.keys(SHARES);
    let stocks = [], filtered = [], selected = null, histories = {};
    let chart = null, candleSeries = null, volumeSeries = null, rawHistory = [], currentTF = "D";
    function toVnd(v) { const n = Number(v); if (!Number.isFinite(n) || n === 0) return 0; return n < 1000 ? Math.round(n * 1000) : Math.round(n); }
    function sma(a, n) { if (a.length < n) return null; let s = 0; for (let i = a.length - n; i < a.length; i++) s += a[i]; return s / n; }
    function rsiSeries(c, p) { const out = new Array(c.length).fill(null); if (c.length <= p) return out; let g = 0, l = 0; for (let i = 1; i <= p; i++) { const ch = c[i] - c[i - 1]; if (ch >= 0) g += ch; else l -= ch; } let ag = g / p, al = l / p; out[p] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); for (let i = p + 1; i < c.length; i++) { const ch = c[i] - c[i - 1]; const gg = ch > 0 ? ch : 0, ll = ch < 0 ? -ch : 0; ag = (ag * (p - 1) + gg) / p; al = (al * (p - 1) + ll) / p; out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); } return out; }
    function bbAt(series, index, period, mult) { if (index < period - 1 || series[index] == null) return null; const win = []; for (let i = index - period + 1; i <= index; i++) { if (series[i] == null) return null; win.push(series[i]); } const mid = win.reduce((a, b) => a + b, 0) / period; return mid + mult * Math.sqrt(win.reduce((a, b) => a + (b - mid) ** 2, 0) / period); }
    function eligible(stock) { return stock.shares * stock.price >= MIN_MCAP; }
    function evaluate(stock) { if (!eligible(stock)) return { pass: false }; const bars = histories[stock.symbol]; if (!bars || bars.length < 30) return { pass: false }; const closes = bars.map(b => b.close); closes[closes.length - 1] = stock.price || closes[closes.length - 1]; const vols = bars.map(b => b.volume); vols[vols.length - 1] = stock.volume || vols[vols.length - 1]; const ma = sma(closes, RULES.maPeriod), maPrev = sma(closes.slice(0, -1), RULES.maPeriod); const rsi = rsiSeries(closes, RULES.rsiPeriod), i = closes.length - 1; const up = bbAt(rsi, i, RULES.bbPeriod, RULES.bbMult), prev = bbAt(rsi, i - 1, RULES.bbPeriod, RULES.bbMult); const cross = up != null && prev != null && rsi[i - 1] <= prev && rsi[i] > up; const last5 = closes.slice(-5).map((c, k) => c * vols[vols.length - 5 + k]); const avg = last5.reduce((a, b) => a + b, 0) / last5.length; return { pass: stock.price > ma && ma > maPrev && cross && avg > RULES.minValue }; }
    function mapVps(row) { const last = Number(row.lastPrice || 0), ref = Number(row.r || 0); return { symbol: row.sym, ex: HNX.has(row.sym) ? "HNX" : "HSX", shares: SHARES[row.sym] || 0, price: toVnd(last || row.closePrice), change: (last - ref) * 1000, percent: ref ? (last - ref) / ref * 100 : 0, volume: Number(row.lot || 0) * 10, ceiling: toVnd(row.c), floor: toVnd(row.f), high: toVnd(row.highPrice), low: toVnd(row.lowPrice), ref: toVnd(ref) }; }
    async function fetchBoard() { const rows = []; for (let i = 0; i < SYMBOLS.length; i += 60) { try { const res = await fetch(`${VPS_BASE}/${SYMBOLS.slice(i, i + 60).join(",")}`); if (res.ok) rows.push(...await res.json()); } catch {} } stocks = rows.filter(r => SHARES[r.sym]).map(mapVps).filter(eligible); const allowed = new Set(stocks.map(s => s.symbol)); for (const k of Object.keys(histories)) if (!allowed.has(k)) delete histories[k]; stocks.forEach(s => { s.signal = evaluate(s); }); applyFilter(); document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filtered.length} mã`; }
    function applyFilter() { const q = document.getElementById("searchInput").value.trim().toUpperCase(); filtered = stocks.filter(s => (!q || s.symbol.includes(q)) && s.signal && s.signal.pass); renderTable(); }
    function renderTable() { const tbody = document.getElementById("priceTable"); tbody.innerHTML = ""; if (!filtered.length) { tbody.innerHTML = `<tr><td colspan="5" class="text-slate-500 text-center py-4">Chưa có mã</td></tr>`; return; } filtered.forEach(s => { const tr = document.createElement("tr"); tr.className = selected === s.symbol ? "selected" : ""; tr.onclick = () => selectStock(s); const cls = s.change > 0 ? "up" : s.change < 0 ? "down" : "ref"; tr.innerHTML = `<td class="font-bold">${s.symbol}</td><td class="text-right ${cls}">${s.price.toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.change > 0 ? "+" : ""}${s.change.toLocaleString("vi-VN")}</td><td class="text-right ${cls}">${s.percent > 0 ? "+" : ""}${s.percent.toFixed(2)}</td><td class="text-right text-slate-500">${(s.volume / 1000).toFixed(0)}K</td>`; tbody.appendChild(tr); }); }
    function ensureChart() { const el = document.getElementById("chart"); if (chart) return; chart = LightweightCharts.createChart(el, { layout: { background: { color: "#0f172a" }, textColor: "#94a3b8" }, grid: { vertLines: { color: "#1e293b" }, horzLines: { color: "#1e293b" } }, timeScale: { borderColor: "#334155" }, autoSize: true }); candleSeries = chart.addCandlestickSeries({ upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444" }); volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" }); chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } }); }
    function normalizeBar(bar) { const time = Number(bar.time || bar.t); return { time: time > 1e12 ? Math.floor(time / 1000) : time, open: toVnd(bar.open ?? bar.o), high: toVnd(bar.high ?? bar.h), low: toVnd(bar.low ?? bar.l), close: toVnd(bar.close ?? bar.c), volume: Number(bar.volume ?? bar.v ?? 0) }; }
    async function loadHistory(symbol) { const to = Math.floor(Date.now() / 1000), from = to - 160 * 86400; try { const res = await fetch(`${CHART_BASE}?symbol=${symbol}&resolution=1D&from=${from}&to=${to}`); if (!res.ok) return []; const data = await res.json(); if (!data || !Array.isArray(data.t)) return []; return data.t.map((t, i) => normalizeBar({ time: t, open: data.o[i], high: data.h[i], low: data.l[i], close: data.c[i], volume: data.v[i] })).slice(-120); } catch { return []; } }
    function loadCache() { try { const saved = JSON.parse(localStorage.getItem("ss_h3") || "null"); if (saved && saved.data && Date.now() - saved.at < 6 * 3600 * 1000) histories = saved.data; } catch {} }
    function saveCache() { try { const data = {}; for (const s of stocks) if (eligible(s) && histories[s.symbol] && histories[s.symbol].length) data[s.symbol] = histories[s.symbol].slice(-120); localStorage.setItem("ss_h3", JSON.stringify({ at: Date.now(), data })); } catch {} }
    async function pool(items, limit, fn) { let i = 0; await Promise.all(Array.from({ length: limit }, async () => { while (i < items.length) await fn(items[i++]); })); }
    async function warm() { loadCache(); const need = stocks.map(s => s.symbol).filter(s => !histories[s] || !histories[s].length); await pool(need, 8, async symbol => { const bars = await loadHistory(symbol); if (bars.length) histories[symbol] = bars; stocks.forEach(s => { s.signal = evaluate(s); }); applyFilter(); document.getElementById("status").textContent = `${new Date().toLocaleTimeString("vi-VN")} • ${filtered.length} mã`; }); saveCache(); }
    function bucketKey(time, tf) { const d = new Date(time * 1000); if (tf === "M") return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000; if (tf === "W") { const day = d.getUTCDay() || 7; return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day + 1) / 1000; } return time; }
    function aggregate(bars, tf) { if (tf === "D") return bars; const map = new Map(); bars.forEach(b => { const key = bucketKey(b.time, tf); const cur = map.get(key); if (!cur) map.set(key, { ...b, time: key }); else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; } }); return [...map.values()]; }
    function drawChart() { ensureChart(); const bars = aggregate(rawHistory, currentTF).filter(b => b.time && b.open); candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close }))); volumeSeries.setData(bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? "rgba(34,197,94,0.45)" : "rgba(239,68,68,0.45)" }))); chart.timeScale().fitContent(); }
    function changeTimeframe(tf) { currentTF = tf; document.querySelectorAll(".tf-btn").forEach(b => b.classList.toggle("active", b.dataset.tf === tf)); if (rawHistory.length) drawChart(); }
    async function selectStock(stock) { selected = stock.symbol; renderTable(); document.getElementById("chartTitle").textContent = stock.symbol; const cls = stock.change > 0 ? "up" : stock.change < 0 ? "down" : "ref"; document.getElementById("companyPanel").innerHTML = `<div class="mb-2"><div class="text-lg font-bold text-blue-400">${stock.symbol}</div><div class="text-sm text-slate-300 mt-0.5">${stock.ex}</div></div><div class="space-y-1.5 text-sm"><div class="flex justify-between"><span class="info-label">Giá</span><span class="info-value ${cls}">${stock.price.toLocaleString("vi-VN")}</span></div><div class="flex justify-between"><span class="info-label">Thay đổi</span><span class="info-value ${cls}">${stock.change > 0 ? "+" : ""}${stock.change.toLocaleString("vi-VN")} (${stock.percent.toFixed(2)}%)</span></div><div class="flex justify-between"><span class="info-label">Khối lượng</span><span class="info-value">${stock.volume.toLocaleString("vi-VN")}</span></div><div class="flex justify-between"><span class="info-label">Sàn</span><span class="info-value">${stock.ex}</span></div></div>`; rawHistory = histories[stock.symbol] && histories[stock.symbol].length ? histories[stock.symbol] : await loadHistory(stock.symbol); histories[stock.symbol] = rawHistory; currentTF = "D"; if (rawHistory.length) drawChart(); }
    document.getElementById("searchInput").addEventListener("input", applyFilter);
    fetchBoard().then(warm); setInterval(fetchBoard, 20000);
  </script>
